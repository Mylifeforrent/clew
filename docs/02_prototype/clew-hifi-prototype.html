<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clew · 高保真可点击原型（SQLite + Kùzu 双库方案）</title>
<style>
  /* ===== Clew Design Tokens（docs/04_hifi/00_设计总览与DesignToken.md）===== */
  :root {
    --page: #F8FAFC; --card: #FFFFFF; --subtle: #F1F5F9;
    --ink: #0F172A; --ink-soft: #334155; --ink-muted: #475569; --ink-faint: #64748B;
    --line: #E2E8F0; --line-strong: #CBD5E1; --line-soft: #F1F5F9;
    --brand-50: #FFF7ED; --brand-100: #FFEDD5; --brand-200: #FED7AA; --brand-300: #FDBA74;
    --brand-400: #FB923C; --brand-500: #F97316; --brand-600: #EA580C; --brand-700: #C2410C;
    --brand-800: #9A3412; --brand-900: #7C2D12;
    --success: #15803D; --success-soft: #F0FDF4; --success-deep: #166534;
    --warning: #B45309; --warning-soft: #FFFBEB; --warning-deep: #92400E;
    --danger: #DC2626; --danger-soft: #FEF2F2; --danger-deep: #B91C1C;
    --info: #2563EB; --info-soft: #EFF6FF; --info-deep: #1E40AF;
    --ai: #4F46E5; --ai-soft: #EEF2FF; --ai-deep: #3730A3;
    --lineage-imported: #475569; --lineage-imported-weak: #64748B;
    --lineage-manual: #0D9488; --lineage-ai: #4F46E5; --lineage-focus: #EA580C;
    --radius: 8px; --radius-lg: 12px;
    --shadow-card: 0 1px 2px rgba(15,23,42,.05);
    --shadow-pop: 0 10px 30px rgba(15,23,42,.14), 0 2px 6px rgba(15,23,42,.08);
    --shadow-node: 0 1px 3px rgba(15,23,42,.10);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--page); color: var(--ink);
    font-family: -apple-system, "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 13px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--brand-100); }
  button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--brand-600); outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  [hidden] { display: none !important; }

  /* ===== 通用组件 ===== */
  .btn {
    appearance: none; display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink-soft); font: inherit; font-size: 12.5px;
    cursor: pointer; transition: background .15s ease, border-color .15s ease, color .15s ease;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--line-strong); background: var(--subtle); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary { background: var(--brand-700); border-color: var(--brand-700); color: #fff; }
  .btn-primary:hover { background: var(--brand-800); border-color: var(--brand-800); }
  .btn-primary:active { background: var(--brand-900); border-color: var(--brand-900); }
  .btn-danger { color: var(--danger); border-color: var(--line); }
  .btn-danger:hover { background: var(--danger-soft); border-color: var(--danger); }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--ink-muted); }
  .btn-ghost:hover { background: var(--subtle); color: var(--ink-soft); }
  .btn-xs { padding: 2px 8px; font-size: 11.5px; border-radius: 5px; }
  .btn-lg { padding: 9px 18px; font-size: 14px; border-radius: 8px; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px;
    border-radius: 999px; font-size: 11px; border: 1px solid var(--line);
    color: var(--ink-muted); background: var(--subtle); white-space: nowrap;
  }
  .badge-ok { background: var(--success-soft); color: var(--success-deep); border-color: transparent; }
  .badge-warn { background: var(--warning-soft); color: var(--warning-deep); border-color: transparent; }
  .badge-danger { background: var(--danger-soft); color: var(--danger-deep); border-color: transparent; }
  .badge-info { background: var(--info-soft); color: var(--info-deep); border-color: transparent; }
  .badge-ai { background: var(--ai-soft); color: var(--ai-deep); border-color: transparent; }
  .badge-brand { background: var(--brand-50); color: var(--brand-800); border-color: var(--brand-200); }
  .badge-solid { background: var(--brand-700); color: #fff; border-color: transparent; }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
  }
  .input, .select {
    font: inherit; font-size: 12.5px; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; width: 100%;
    transition: border-color .15s ease;
  }
  .input:focus, .select:focus { border-color: var(--brand-600); outline: none; box-shadow: 0 0 0 3px rgba(234,88,12,.12); }
  .input::placeholder { color: var(--ink-faint); }
  .kbd { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10.5px; color: var(--ink-faint);
    border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: var(--card); }
  code, pre, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .muted { color: var(--ink-muted); } .faint { color: var(--ink-faint); }
  .sep { height: 1px; background: var(--line-soft); margin: 10px 0; }

  /* ===== 应用框架 ===== */
  #app { height: 100%; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    background: var(--card); border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; cursor: pointer; }
  .logo-mark {
    width: 26px; height: 26px; border-radius: 7px; background: var(--brand-800);
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .navpill {
    display: flex; gap: 3px; background: var(--subtle); border-radius: 9px; padding: 3px;
  }
  .navpill button {
    appearance: none; border: none; background: transparent; color: var(--ink-muted);
    font: inherit; font-size: 12.5px; padding: 4px 12px; border-radius: 7px; cursor: pointer;
    transition: all .15s ease;
  }
  .navpill button:hover { color: var(--ink); }
  .navpill button.active { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: var(--shadow-card); }
  .navpill button:disabled { opacity: .4; cursor: not-allowed; }
  .searchbox {
    display: flex; align-items: center; gap: 6px; flex: 1; max-width: 340px;
    border: 1px solid var(--line); border-radius: 7px; padding: 4px 10px; background: var(--card);
  }
  .searchbox input { all: unset; font: inherit; font-size: 12.5px; color: var(--ink); flex: 1; }
  .userchip { display: flex; align-items: center; gap: 8px; }
  .avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--brand-100); color: var(--brand-800);
    display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; }
  .main { flex: 1; min-height: 0; display: flex; }
  .screen { flex: 1; min-width: 0; overflow: auto; padding: 16px; }

  /* ===== 画布 ===== */
  .canvas-screen { display: flex; flex-direction: column; height: 100%; flex: 1; min-width: 0; }
  .canvas-toolbar {
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 8px 14px;
    background: var(--card); border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .canvas-area { flex: 1; position: relative; overflow: hidden; background: var(--page); }
  .canvas-area::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(circle, rgba(148,163,184,.35) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  .canvas-inner { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  #edgeSvg { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }
  .node {
    position: absolute; width: 288px; background: var(--card);
    border: 1px solid var(--line-strong); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-node); transition: box-shadow .2s ease, border-color .2s ease;
    user-select: none;
  }
  .node:hover { box-shadow: 0 3px 10px rgba(15,23,42,.12); }
  .node.seed { border-color: var(--brand-200); }
  .node.seed .node-topbar { height: 2px; background: var(--brand-600); opacity: .8; border-radius: 12px 12px 0 0; }
  .node-header {
    display: flex; align-items: center; gap: 8px; padding: 9px 10px; cursor: pointer;
    border-bottom: 1px solid var(--line-soft); border-radius: 11px 11px 0 0;
  }
  .node.seed .node-header { background: var(--brand-50); }
  .node-name { font-weight: 600; font-size: 13px; color: var(--ink); flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node-name .dsid { display: block; font-weight: 400; font-size: 10.5px; color: var(--ink-faint); }
  .chev { color: var(--ink-faint); font-size: 10px; transition: transform .2s ease; }
  .node.collapsed .chev { transform: rotate(-90deg); }
  .field-row {
    display: flex; align-items: center; gap: 6px; padding: 0 10px; height: 30px;
    border-bottom: 1px solid var(--line-soft); cursor: pointer; position: relative;
    transition: background .15s ease;
  }
  .field-row:last-child { border-bottom: none; }
  .field-row:hover { background: var(--subtle); }
  .field-row.selected { background: var(--brand-50); }
  .field-row.in-chain { background: var(--brand-50); }
  .field-row.in-chain .fname { color: var(--brand-800); font-weight: 600; }
  .field-row.dimmed { opacity: .45; }
  .fname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--ink-soft); }
  .ftype { font-size: 10px; color: var(--ink-faint); font-family: ui-monospace, Menlo, monospace; }
  .f-dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--line-strong); flex-shrink: 0; }
  .field-row.selected .f-dot, .field-row.in-chain .f-dot { border-color: var(--brand-600); background: var(--brand-100); }
  .node-collapsed-hint { padding: 7px 10px; font-size: 11px; color: var(--ink-faint); border-top: 1px solid var(--line-soft); }
  .node.selected { border-color: var(--brand-600); box-shadow: 0 0 0 1.5px var(--brand-600), 0 3px 12px rgba(234,88,12,.18); }
  .src-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .src-imported { background: var(--lineage-imported); }
  .src-manual { background: var(--lineage-manual); }
  .src-ai { background: var(--lineage-ai); }

  .legend {
    position: absolute; left: 12px; bottom: 12px; background: rgba(255,255,255,.92);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 11px;
    color: var(--ink-muted); display: flex; flex-direction: column; gap: 4px; pointer-events: none;
  }
  .legend .lg-row { display: flex; align-items: center; gap: 7px; }
  .lg-line { width: 26px; height: 0; border-top: 2px solid; flex-shrink: 0; }
  .zoomctl { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
  .zoomctl button { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--card); font-size: 14px; cursor: pointer; color: var(--ink-soft); }
  .zoomctl button:hover { background: var(--subtle); }
  .graph-badge { cursor: pointer; }

  .side { width: 216px; border-right: 1px solid var(--line); background: var(--card); padding: 10px;
    overflow: auto; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; }
  .side h4 { margin: 0 0 6px; font-size: 11px; font-weight: 600; color: var(--ink-muted); letter-spacing: .3px; }
  .ds-item { padding: 6px 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; transition: all .15s ease; }
  .ds-item:hover { background: var(--subtle); }
  .ds-item.active { border-color: var(--line); background: var(--subtle); }
  .ds-item .nm { font-size: 12.5px; color: var(--ink-soft); display: flex; justify-content: space-between; }
  .ds-item .sub { font-size: 10.5px; color: var(--ink-faint); }
  .file-item { display: flex; align-items: center; gap: 7px; padding: 5px 6px; font-size: 11.5px; color: var(--ink-soft); border-radius: 6px; }
  .file-item:hover { background: var(--subtle); cursor: pointer; }
  .ftag { font-size: 9.5px; padding: 0 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--ink-faint); font-family: ui-monospace, monospace; }

  .detail { width: 300px; border-left: 1px solid var(--line); background: var(--card); padding: 12px;
    overflow: auto; flex-shrink: 0; }
  .detail h3 { margin: 0 0 4px; font-size: 14px; }
  .detail .sub { font-size: 11px; color: var(--ink-faint); margin-bottom: 10px; }
  .locator-card { border: 1px solid var(--brand-200); background: var(--brand-50); border-radius: 8px; padding: 8px 10px; }
  .locator-card .file { font-weight: 600; font-size: 12px; color: var(--brand-800); display: flex; align-items: center; gap: 6px; }
  .locator-card .loc { font-size: 11.5px; color: var(--ink-soft); margin-top: 3px; }
  .kv { display: flex; gap: 8px; font-size: 12px; margin: 3px 0; }
  .kv .k { width: 64px; color: var(--ink-faint); flex-shrink: 0; }
  .kv .v { color: var(--ink-soft); min-width: 0; }
  .anno { border-left: 2px solid var(--brand-200); padding: 2px 0 2px 9px; margin: 7px 0; font-size: 12px; color: var(--ink-soft); }
  .anno .meta { font-size: 10.5px; color: var(--ink-faint); margin-top: 2px; }
  .codelist { background: var(--subtle); border-radius: 7px; padding: 8px 10px; font-size: 10.5px;
    color: var(--ink-soft); white-space: pre-wrap; word-break: break-all; line-height: 1.55; }
  .updown { display: flex; flex-direction: column; gap: 3px; }
  .updown a { font-size: 12px; color: var(--brand-700); cursor: pointer; text-decoration: none; }
  .updown a:hover { text-decoration: underline; }
  .updown .hop { color: var(--ink-faint); font-size: 10.5px; }
  .sec-t { font-size: 11px; font-weight: 600; color: var(--ink-muted); margin: 12px 0 5px; display: flex; align-items: center; justify-content: space-between; }

  /* ===== 弹层 ===== */
  .overlay { position: fixed; inset: 0; background: rgba(15,23,42,.42); display: flex;
    align-items: center; justify-content: center; z-index: 60; padding: 24px; }
  .modal { background: var(--card); border-radius: 14px; box-shadow: var(--shadow-pop);
    width: min(880px, 94vw); max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
  .modal-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .modal-head h3 { margin: 0; font-size: 14px; flex: 1; }
  .modal-body { padding: 14px 16px; overflow: auto; }
  .modal-foot { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }

  /* 预览表格 */
  .pv-wrap { border: 1px solid var(--line); border-radius: 8px; overflow: auto; max-height: 420px; }
  .pv-table { border-collapse: collapse; font-size: 11.5px; width: max-content; min-width: 100%; }
  .pv-table th, .pv-table td { border: 1px solid var(--line-soft); padding: 4px 10px; white-space: nowrap; }
  .pv-table thead th { background: var(--subtle); color: var(--ink-muted); position: sticky; top: 0; }
  .pv-table thead tr.h2 th { top: 25px; background: var(--card); }
  .pv-table .hl-col { background: var(--brand-50) !important; color: var(--brand-800); }
  .pv-table .hl-row td:first-child { background: var(--brand-50); color: var(--brand-800); }
  .pv-table td.hl-col { color: var(--brand-800); }
  .crumb { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-muted); margin-bottom: 10px; flex-wrap: wrap; }
  .crumb b { color: var(--brand-700); }

  /* ===== 导入向导 ===== */
  .steps { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
  .step { display: flex; align-items: center; gap: 8px; color: var(--ink-faint); font-size: 12.5px; }
  .step .n { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line-strong);
    display: inline-flex; align-items: center; justify-content: center; font-size: 11px; background: var(--card); }
  .step.active { color: var(--brand-700); font-weight: 600; }
  .step.active .n { border-color: var(--brand-700); color: var(--brand-700); background: var(--brand-50); }
  .step.done { color: var(--success-deep); }
  .step.done .n { border-color: var(--success); color: #fff; background: var(--success); }
  .step-line { width: 40px; height: 1px; background: var(--line-strong); }
  .dropzone { border: 1.5px dashed var(--line-strong); border-radius: 12px; padding: 28px; text-align: center;
    color: var(--ink-faint); cursor: pointer; transition: all .15s ease; background: var(--card); }
  .dropzone:hover, .dropzone.hot { border-color: var(--brand-600); background: var(--brand-50); color: var(--brand-700); }
  .report-row { display: grid; grid-template-columns: 74px 1fr 110px 190px; gap: 10px; align-items: center;
    padding: 6px 10px; border-bottom: 1px solid var(--line-soft); font-size: 12px; }
  .report-row.head { color: var(--ink-faint); font-size: 11px; background: var(--subtle); border-radius: 6px 6px 0 0; }
  .sum-cards { display: flex; gap: 10px; margin: 12px 0; }
  .sum-card { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: var(--card); }
  .sum-card .num { font-size: 22px; font-weight: 700; }
  .stat-ok .num { color: var(--success-deep); } .stat-merge .num { color: var(--info-deep); } .stat-bad .num { color: var(--danger-deep); }

  /* ===== AI 对话 ===== */
  .chat-layout { display: flex; gap: 14px; height: 100%; }
  .chat-side { width: 250px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; overflow: auto; }
  .chat-main { flex: 1; min-width: 0; display: flex; flex-direction: column; border: 1px solid var(--line);
    border-radius: 12px; background: var(--card); overflow: hidden; }
  .chat-scroll { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { display: flex; gap: 9px; max-width: 88%; }
  .msg.me { align-self: flex-end; flex-direction: row-reverse; }
  .msg .bubble { border-radius: 12px; padding: 8px 12px; font-size: 13px; }
  .msg.ai .bubble { background: var(--card); border: 1px solid var(--line); color: var(--ink-soft); }
  .msg.me .bubble { background: var(--brand-700); color: #fff; }
  .msg .avatar { margin-top: 2px; }
  .msg.ai .avatar { background: var(--ai-soft); color: var(--ai-deep); font-size: 12px; }
  .tool-card { border: 1px solid var(--line); border-radius: 10px; background: var(--subtle);
    font-size: 12px; overflow: hidden; align-self: flex-start; max-width: 92%; }
  .tool-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer; }
  .tool-head .tn { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: var(--ai-deep); font-weight: 600; }
  .tool-body { border-top: 1px solid var(--line-soft); padding: 8px 10px; background: var(--card); }
  .tool-body .mini-list { display: flex; flex-direction: column; gap: 3px; }
  .mini-hit { display: flex; gap: 8px; align-items: center; font-size: 12px; }
  .mini-hit .score { margin-left: auto; }
  .chain-svg { display: block; margin: 6px 0; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .qchip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 12px;
    font-size: 12px; color: var(--ink-soft); cursor: pointer; transition: all .15s ease; }
  .qchip:hover { border-color: var(--brand-600); color: var(--brand-700); background: var(--brand-50); }
  .suggest-card { border: 1px dashed var(--ai); background: var(--ai-soft); border-radius: 10px; padding: 9px 11px; font-size: 12px; color: var(--ai-deep); }
  .chat-input { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
  .typing { display: inline-flex; gap: 3px; align-items: center; padding: 4px 2px; }
  .typing i { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-faint); animation: tp 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes tp { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }
  .edge-anim { animation: dashmove 1.1s linear infinite; }
  @keyframes dashmove { to { stroke-dashoffset: -11; } }

  /* ===== 表格/页面 ===== */
  .tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .tbl th { text-align: left; color: var(--ink-muted); font-size: 11.5px; font-weight: 600;
    padding: 7px 10px; background: var(--subtle); border-bottom: 1px solid var(--line); white-space: nowrap; }
  .tbl td { padding: 7px 10px; border-bottom: 1px solid var(--line-soft); color: var(--ink-soft); vertical-align: top; }
  .tbl tr:hover td { background: rgba(241,245,249,.5); }
  .tbl-wrap { border: 1px solid var(--line); border-radius: 10px; overflow: auto; background: var(--card); }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }

/* ---------------- 血缘邻接（追踪链） ---------------- */
function visibleEdges() {
  return DATA.edges.filter(e =>
    S.filters[e.src] !== false && e.conf >= S.filters.minConf);
}
function chainOf(dsid, fname) {
  const ups = [], downs = [];
  const walkUp = (d, f) => {
    DATA.edges.forEach(e => {
      if (e.td === d && e.tf === f && !ups.some(u => u.id === e.id)) {
        ups.push(e);
        if (e.ff) walkUp(e.fd, e.ff);
      }
    });
  };
  const walkDown = (d, f) => {
    DATA.edges.forEach(e => {
      if (e.fd === d && e.ff === f && !downs.some(u => u.id === e.id)) {
        downs.push(e);
        if (e.tf) walkDown(e.td, e.tf);
      }
    });
  };
  walkUp(dsid, fname); walkDown(dsid, fname);
  return ups.concat(downs);
}

/* 画布渲染：节点 + SVG 边 */
function drawGraph() {
  const layer = document.getElementById("nodeLayer");
  const svg = document.getElementById("edgeSvg");
  if (!layer || !svg) return;
  const vis = visibleEdges();
  const chainIds = S.focus ? chainOf(S.focus.ds, S.focus.f).map(e => e.id) : [];
  const chainSet = new Set(chainIds);
  const chainFields = new Set();
  if (S.focus) {
    chainIds.forEach(id => {
      const e = DATA.edges.find(x => x.id === id);
      chainFields.add(e.fd + "." + e.ff); chainFields.add(e.td + "." + e.tf);
    });
    chainFields.add(S.focus.ds + "." + S.focus.f);
  }
  // 节点
  layer.innerHTML = DATA.datasets.map(d => {
    const L = LAYOUT[d.id];
    const isSeed = d.id === S.seedDs;
    const isSel = S.selected && S.selected.ds === d.id;
    const collapsed = S.collapsed[d.id];
    const rows = collapsed ? "" : d.fields.map((f, i) => {
      const key = d.id + "." + f.name;
      const isChain = chainFields.has(key);
      const dim = S.focus && !isChain;
      return '<div class="field-row ' + (isChain ? "in-chain" : "") + (dim ? " dimmed" : "") +
        (S.selected && S.selected.ds === d.id && S.selected.f === f.name ? " selected" : "") +
        '" style="height:' + ROW_H + 'px" onclick="selectField(\'' + d.id + '\',\'' + f.name + '\')" ondblclick="dblFocus(\'' + d.id + '\',\'' + f.name + '\')">' +
        '<span class="f-dot"></span><span class="fname">' + esc(f.name) + '</span>' +
        '<span class="ftype">' + esc(f.type) + '</span></div>';
    }).join("");
    const selEdgeColor = d.fields.some(f => {
      const k = d.id + "." + f.name;
      return chainFields.has(k);
    });
    return '<div class="node ' + (isSeed ? "seed" : "") + (isSel ? " selected" : "") + (collapsed ? " collapsed" : "") +
      '" style="left:' + L.x + 'px;top:' + L.y + 'px;width:' + NODE_W + 'px">' +
      (isSeed ? '<div class="node-topbar"></div>' : "") +
      '<div class="node-header" onclick="toggleCollapse(\'' + d.id + '\')">' +
        '<span class="chev">▾</span><div class="node-name">' + esc(d.name) + '<span class="dsid">' + d.id + ' · ' + LAYER[d.layer] + '</span></div>' +
        '<span class="badge badge-xs ' + (isSeed ? "badge-brand" : "") + '" style="font-size:10px;padding:0 6px">' + (isSeed ? "种子" : d.fields.length + " 字段") + '</span>' +
      '</div>' + rows + (collapsed ? '<div class="node-collapsed-hint">已折叠 · ' + d.fields.length + ' 个字段（表级边仍显示）</div>' : "") +
    '</div>';
  }).join("");
  // 边
  const W = 1800, H = 950;
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  let markers = ["#475569", "#64748B", "#0D9488", "#4F46E5", "#EA580C"].map(c =>
    '<marker id="ah' + c.slice(1) + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
    '<path d="M 0 0 L 10 5 L 0 10 z" fill="' + c + '"/></marker>').join("");
  let paths = vis.map(e => {
    const isChain = chainSet.has(e.id);
    const dim = S.focus && !isChain;
    let style, x1, y1, x2, y2, marker;
    const srcCollapsed = S.collapsed[e.fd], tgtCollapsed = S.collapsed[e.td];
    if (e.ff == null) { // 表级边：节点边缘中点
      x1 = LAYOUT[e.fd].x + NODE_W; y1 = LAYOUT[e.fd].y + nodeH(e.fd) / 2;
      x2 = LAYOUT[e.td].x;          y2 = LAYOUT[e.td].y + nodeH(e.td) / 2;
      style = e.src === "ai" ? { stroke: "#4F46E5", w: 1.8, dash: "6 5" } :
              e.src === "manual" ? { stroke: "#0D9488", w: 1.7, dash: "4 5" } :
              { stroke: "#64748B", w: 1.4, dash: "4 5" };
    } else {
      x1 = LAYOUT[e.fd].x + NODE_W; y1 = rowY(e.fd, e.ff);
      x2 = LAYOUT[e.td].x;          y2 = rowY(e.td, e.tf);
      style = e.src === "ai" ? { stroke: "#4F46E5", w: 1.8, dash: "6 5" } :
              e.src === "manual" ? { stroke: "#0D9488", w: 1.7, dash: "" } :
              { stroke: "#475569", w: 1.55, dash: "" };
    }
    if (srcCollapsed) { y1 = LAYOUT[e.fd].y + HEAD_H / 2; }
    if (tgtCollapsed) { y2 = LAYOUT[e.td].y + HEAD_H / 2; }
    marker = (isChain ? "#EA580C" : style.stroke).slice(1);
    const stroke = isChain ? "#EA580C" : style.stroke;
    const w = isChain ? 2.6 : style.w;
    const dash = isChain ? style.dash : style.dash;
    const cls = (dash && (e.src === "ai" || isChain)) ? "edge-anim" : "";
    const dx = Math.max(46, Math.abs(x2 - x1) * 0.42);
    const dstr = "M " + x1 + " " + y1 + " C " + (x1 + dx) + " " + y1 + ", " + (x2 - dx) + " " + y2 + ", " + x2 + " " + y2;
    return '<path d="' + dstr + '" fill="none" stroke="' + stroke + '" stroke-width="' + w + '"' +
      (dash ? ' stroke-dasharray="' + dash + '"' : "") + (cls ? ' class="' + cls + '"' : "") +
      (dim ? ' opacity="0.15"' : (!isChain && S.focus ? ' opacity="0.25"' : " opacity=\"0.9\"")) +
      ' marker-end="url(#ah' + marker + ')"' +
      '><title>' + esc(edgeTitle(e)) + '</title></path>';
  }).join("");
  svg.innerHTML = "<defs>" + markers + "</defs>" + paths;
}
function edgeTitle(e) {
  const a = e.ff ? e.fd + "." + e.ff : e.fd + "（表级）";
  const b = e.tf ? e.td + "." + e.tf : e.td + "（表级）";
  return a + " → " + b + "\n转换: " + e.transform + "\n来源: " + SRC_LABEL[e.src] + " · 置信度 " + e.conf.toFixed(2) + "\nedge_id: " + e.id + "（SQLite edge.id 回链）";
}
function toggleCollapse(id) {
  S.collapsed[id] = !S.collapsed[id];
  drawGraph();
}
function dblFocus(dsid, fname) {
  S.selected = { ds: dsid, f: fname };
  S.focus = (S.focus && S.focus.ds === dsid && S.focus.f === fname) ? null : { ds: dsid, f: fname };
  drawGraph(); renderDetail();

    return '<div style="display:flex;gap:14px;flex-wrap:wrap">' +
      '<div class="card" style="flex:1;min-width:320px;padding:14px">' +
        '<div class="sec-t" style="margin:0 0 10px">标签列表（锚定 change_log 位置）</div>' +
        tags.map(t => '<div class="log-item" style="cursor:pointer" onclick="S.diffSel={from:\'' + (S.diffSel.to || "v1.1-r1") + '\',to:\'' + t.name + '\'};render()">' +
          '<span class="badge badge-brand">' + t.name + '</span><span style="flex:1">' + esc(t.note) + '<div class="faint" style="font-size:10.5px">@seq ' + t.seq + ' · v' + t.batch + ' 后 · ' + t.by + ' · ' + t.at + '</div></span>' +
          '<button class="btn btn-xs btn-danger" ' + (isAdmin() ? "" : "disabled title='仅 admin'") + ' onclick="event.stopPropagation();rollbackTag(\'' + t.name + '\')">回滚到此</button></div>').join("") +
        '<div style="margin-top:10px;display:flex;gap:8px">' +
          '<select class="select" id="diff-from" style="flex:1">' + tags.map(t => '<option ' + (S.diffSel.from === t.name ? "selected" : "") + '>' + t.name + '</option>').join("") + '</select>' +
          '<span class="faint" style="align-self:center">→</span>' +
          '<select class="select" id="diff-to" style="flex:1">' + tags.map(t => '<option ' + (S.diffSel.to === t.name ? "selected" : "") + '>' + t.name + '</option>').join("") + '</select>' +
          '<button class="btn btn-primary" onclick="doDiff()">对比</button></div>' +
      '</div>' +
      '<div class="card" style="flex:1.2;min-width:380px;padding:14px">' + diffHtml() + '</div>' +
    '</div>';
  }
  if (S.verTab === "log") {
    return '<div class="card" style="padding:6px 14px;max-height:70vh;overflow:auto">' +
      '<div class="faint" style="font-size:11px;padding:6px 0">change_log 是回滚与 diff 的唯一依据；标签创建与回滚审计不写此表（防止被反做），分别留痕于 version_tag 与 rollback_record。</div>' +
      DATA.logs.map(l =>
        '<div class="log-item"><span class="seq">#' + l.seq + '</span>' +
        '<span class="opb op-' + l.op + '">' + { added: "added", updated: "updated", deleted: "deleted" }[l.op] + '</span>' +
        '<span class="badge" style="font-size:10px">' + l.kind + '</span>' +
        '<span class="mono" style="font-size:11.5px;flex:1">' + esc(l.key) + (l.detail ? '<div class="faint" style="font-size:10.5px;font-family:inherit">' + esc(l.detail) + '</div>' : "") + '</span>' +
        '<span class="faint" style="font-size:11px;width:120px;text-align:right">' + l.actor + (l.batch ? ' · v' + l.batch : "") + '<br>' + l.at + '</span></div>').join("") +
    '</div>';
  }
  return usersHtml();
}
function diffHtml() {
  const d = DATA.diffSample;
  const active = S.diffSel.from === d.from && S.diffSel.to === d.to;
  return '<div class="sec-t" style="margin:0 0 10px">标签 diff（净变更，按实体归并）</div>' +
    (active ?
      '<div class="sum-cards" style="margin:0 0 10px">' +
        '<div class="sum-card stat-ok"><div class="num">' + d.summary.added + '</div>added</div>' +
        '<div class="sum-card stat-merge"><div class="num">' + d.summary.updated + '</div>updated</div>' +
        '<div class="sum-card stat-bad"><div class="num">' + d.summary.deleted + '</div>deleted</div></div>' +
      '<div class="tbl-wrap" style="max-height:300px;overflow:auto"><table class="tbl"><tbody>' +
      d.items.map(i =>
        '<tr><td style="width:76px"><span class="opb op-' + i.op + '">' + i.op + '</span></td>' +
        '<td style="width:52px" class="faint">' + i.kind + '</td>' +
        '<td class="mono" style="font-size:11.5px">' + esc(i.key) + '<div class="faint" style="font-size:10.5px;font-family:inherit">' + esc(i.detail) + '</div></td></tr>').join("") +
      '</tbody></table></div>' +
      '<div class="faint" style="font-size:11px;margin-top:8px">' + d.from + ' → ' + d.to + ' 区间 change_log 归并结果；区间内先增后删的实体不计入净变更。</div>'
      : '<div class="faint" style="padding:40px 0;text-align:center">选择两个标签后点击「对比」<br>（原型内置示例：v1.1-r1 → v2.0-r1）</div>');
}
function doDiff() {
  S.diffSel = { from: document.getElementById("diff-from").value, to: document.getElementById("diff-to").value };
  render();
}
function rollbackBatch(v) {
  confirmModal("回滚批次 v" + v, "将反做该批次产生的全部变更（change_log 逆向），并触发 Kùzu 图重建。回滚幂等，可重复执行。", () => {
    DATA.batches.find(b => b.v === v).rolledBack = true;
    DATA.graphState.state = "dirty"; S.graph.state = "dirty"; render();
    toast("批次 v" + v + " 已回滚 · Kùzu 标脏 → 自动重建", "warn");
    setTimeout(() => { S.graph.state = "clean"; DATA.graphState = { ...DATA.graphState, state: "clean", rebuiltAt: "2026-11-16 12:05", rebuiltBy: S.user.name }; render(); }, 1600);
    setTimeout(() => toast("图已重建 · 状态 clean（rollback_record 已审计）"), 1700);
  });
}
function rollbackTag(name) {
  confirmModal("回滚到标签 " + name, "将反做该标签 change_seq 之后的全部日志（含人工编辑与批次），标注保留、标签永久保留。", () => {
    DATA.graphState.state = "dirty"; S.graph.state = "dirty"; render();
    toast("已回滚到 " + name + " · Kùzu 标脏重建中", "warn");
    setTimeout(() => { S.graph.state = "clean"; DATA.graphState = { ...DATA.graphState, state: "clean", rebuiltAt: "2026-11-16 12:06", rebuiltBy: S.user.name }; render(); }, 1600);
  });
}
function confirmModal(title, text, onOk) {
  modal(title, '<div style="font-size:13px;color:var(--ink-soft);padding:4px 0">' + esc(text) + '</div>' +
    '<div class="codelist" style="margin-top:8px">graph_state.state: clean → dirty → rebuilding → clean</div>',
    '<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-danger" id="cf-ok">确认回滚</button>');
  document.getElementById("cf-ok").onclick = () => { closeModal(); onOk(); };
}
function usersHtml() {
  const u = DATA.users;
  return '<div style="display:flex;gap:14px;flex-wrap:wrap">' +
    '<div class="card" style="flex:1;min-width:320px;padding:0;overflow:hidden">' +
      '<div class="sec-t" style="padding:12px 14px 0;margin:0">用户（JWT 认证 · 密码加盐哈希）</div>' +
      '<table class="tbl" style="margin-top:8px"><thead><tr><th>用户</th><th>账号</th><th>角色</th><th>说明</th></tr></thead><tbody>' +
      u.map(x => '<tr><td><span class="avatar" style="display:inline-flex;vertical-align:-6px;margin-right:6px">' + x.name[0] + '</span>' + x.name + '</td><td class="mono">' + x.username + '</td>' +
        '<td><span class="badge ' + (x.role === "admin" ? "badge-brand" : x.role === "editor" ? "badge-ok" : "") + '">' + x.role + '</span></td><td class="faint">' + x.desc + '</td></tr>').join("") +
      '</tbody></table></div>' +
    '<div class="card" style="flex:1.3;min-width:420px;padding:0;overflow:hidden">' +
      '<div class="sec-t" style="padding:12px 14px 0;margin:0">RBAC 能力矩阵（工作区级，不做对象级 ACL）</div>' +
      '<table class="tbl matrix" style="margin-top:8px"><thead><tr><th>能力</th><th>viewer</th><th>editor</th><th>admin</th></tr></thead><tbody>' +
      [["浏览血缘图 / 回源预览", 1, 1, 1], ["AI 只读问答（trace/search）", 1, 1, 1], ["上传源文件 / 导入清单", 0, 1, 1], ["画布纠错编辑 / 拖线建边", 0, 1, 1], ["追加标注", 0, 1, 1], ["确认 / 拒绝 AI 建议边", 0, 1, 1], ["创建版本标签", 0, 1, 1], ["按批次 / 标签回滚", 0, 0, 1], ["用户与角色管理", 0, 0, 1], ["删除数据集", 0, 0, 1]].map(r =>
        '<tr><td>' + r[0] + '</td>' + [1, 2, 3].map(i => '<td>' + (r[i] ? '<span class="yes">✓</span>' : '<span class="no">—</span>') + '</td>').join("") + '</tr>').join("") +
      '</tbody></table>' +
      '<div class="faint" style="padding:10px 14px;font-size:11px">所有写操作记录操作者（created_by / actor 取自 JWT）；文件存储路径不对外暴露，预览与下载受权限控制。</div>' +
    '</div></div>';
}

/* ============================================================
   架构总览（SQLite + Kùzu 双库方案）
   ============================================================ */
function archHtml() {
  return '<div class="screen" style="max-width:1080px;margin:0 auto">' +
    '<h2 style="font-size:16px;margin:4px 0 4px">存储架构：SQLite（事实源）+ Kùzu 0.11.3（血缘图）</h2>' +
    '<div class="faint" style="margin-bottom:14px;font-size:12px">2026-11 存储重设计 · 单进程、双嵌入式库、无消息队列、无搜索集群 · REST 契约不变，前端无感</div>' +

    '<div class="arch-grid" style="margin-bottom:14px">' +
      '<div class="arch-box" style="flex:1.1">' +
        '<h4>📄 SQLite <span class="arch-tag badge-ok badge">唯一事实源</span></h4>' +
        '<ul><li>user / source_file（sha256 去重）</li><li>dataset / field（src_locator JSON）</li>' +
        '<li>edge —— 血缘边 + transform/confidence/source</li><li>import_batch / version_tag / change_log / rollback_record</li>' +
        '<li>annotation / description_draft / <b>graph_state</b>（双库协调）</li>' +
        '<li>FTS5/LIKE 搜索 · 详情/历史/审计全部走主库</li></ul>' +
      '</div>' +
      '<div class="arch-box" style="flex:1.1;border-color:var(--ai)">' +
        '<h4>🕸 Kùzu 0.11.3 <span class="badge badge-ai arch-tag">血缘图派生层</span></h4>' +
        '<ul><li>NODE：Dataset / Field（仅 id+name）</li>' +
        '<li>REL：<span class="mono">LINEAGE_FIELD</span> / <span class="mono">LINEAGE_TABLE</span>（edge_id, source, confidence）</li>' +
        '<li>Cypher 变长路径：trace / subgraph / impact</li><li>0.11.3 = 归档终版（MIT · cp38–cp314 wheel）</li>' +
        '<li>进程内启动，无服务端口；可随时从 SQLite 全量重建</li></ul>' +
      '</div>' +
      '<div class="arch-box" style="flex:0.9">' +
        '<h4>🗂 文件托管</h4><ul><li>data/files/ 本地目录</li>' +
        '<li>sha256 去重：同内容一份</li><li>受控预览（回源核查弹窗）</li>' +
        '<li>导入时 openpyxl 实文件核查定位器</li></ul>' +
      '</div>' +
    '</div>' +

    '<div class="card" style="padding:14px;margin-bottom:14px">' +
      '<div class="sec-t" style="margin:0 0 4px">写路径（先主库、后图库、失败标脏）</div>' +
      '<div class="flowrow"><span>导入 / 画布编辑 / AI 确认 → <b>① SQLite 事务</b>（edge + change_log，业务承诺在此） → <b>② Kùzu 事务</b>（CREATE/DELETE Rel） → 成功：<span class="badge badge-ok" style="font-size:10px">clean</span> / 失败：<span class="badge badge-warn" style="font-size:10px">dirty</span>（仍响应 2xx）</span></div>' +
      '<div class="sec-t" style="margin:12px 0 4px">读路径（查询主入口 = SQLite，拓扑 = Kùzu）</div>' +
      '<div class="flowrow"><span>搜索 / 详情 / 历史 / 审计 → <b>SQLite</b>；血缘 trace / subgraph / impact → <b>Kùzu Cypher</b>（命中 edge_id → 回 SQLite hydrate）；graph_state=dirty → 自动全量重建 → 失败 → <b>降级递归 CTE</b>（契约不变）</span></div>' +
      '<div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap">' +
        '<div class="principle" style="background:var(--success-soft)"><div class="pt"><span class="pn" style="background:var(--success)">1</span>SQLite 是唯一事实源</div>Kùzu 数据永远可从主库推导；写操作的真实性由主库 + change_log 承诺。</div>' +
        '<div class="principle" style="background:var(--ai-soft)"><div class="pt"><span class="pn" style="background:var(--ai)">2</span>Kùzu 是可移除的派生层</div>重建 = 导出 CSV → COPY FROM，秒级幂等；最坏情况整体退回 CTE 单库，零数据丢失。</div>' +
        '<div class="principle" style="background:var(--brand-50)"><div class="pt"><span class="pn" style="background:var(--brand-700)">3</span>REST 契约不变</div>前端与 AI 工具无感切换引擎；CTE 实现永久保留为降级路径。</div>' +
      '</div>' +
    '</div>' +

    '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px">' +
      '<div class="card" style="flex:1;min-width:420px;padding:14px">' +
        '<div class="sec-t" style="margin:0 0 8px">Kùzu 图模型（DDL）</div>' +
        '<div class="codelist">CREATE NODE TABLE Dataset (id STRING, name STRING, PRIMARY KEY(id));\nCREATE NODE TABLE Field   (id STRING, name STRING, PRIMARY KEY(id));\n\nCREATE REL TABLE LINEAGE_FIELD (FROM Field TO Field,\n    edge_id INT64, source STRING, confidence DOUBLE);\nCREATE REL TABLE LINEAGE_TABLE (FROM Dataset TO Dataset,\n    edge_id INT64, source STRING, confidence DOUBLE);</div>' +
        '<div class="faint" style="font-size:10.5px;margin-top:6px">Field.id = "&lt;dataset_id&gt;.&lt;field_name&gt;"；edge_id 回链 SQLite edge.id；transform/note 等业务属性不进图。</div>' +
      '</div>' +
      '<div class="card" style="flex:1;min-width:420px;padding:14px">' +
        '<div class="sec-t" style="margin:0 0 8px">核心 Cypher（trace / impact）</div>' +
        '<div class="codelist">-- N 跳上游（变长路径，一次查出）\nMATCH p = (src:Field)&lt;-[:LINEAGE_FIELD*1..3]-(f:Field {id: $fid})\nRETURN src.id, r.edge_id, length(p) AS hop ORDER BY hop;\n\n-- 下游影响面\nMATCH p = (f:Field {id: $fid})-[:LINEAGE_FIELD*1..5]-&gt;(down)\nRETURN down.id, length(p) AS hop;</div>' +
        '<div class="faint" style="font-size:10.5px;margin-top:6px">跳数上限由服务端白名单注入；结果组装为统一 GraphPayload 返回。</div>' +
      '</div>' +
    '</div>' +

    '<div class="card" style="padding:14px">' +
      '<div class="sec-t" style="margin:0 0 8px">当前图状态（graph_state 表）与运维命令</div>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px">' +
        '<span class="badge ' + (DATA.graphState.state === "clean" ? "badge-ok" : "badge-warn") + '">state = ' + DATA.graphState.state + '</span>' +
        '<span class="badge">node_count = ' + DATA.graphState.nodeCount + '</span>' +
        '<span class="badge">rel_count = ' + DATA.graphState.relCount + '（与 SQLite edge 表对账）</span>' +
        '<span class="badge">rebuilt_at = ' + DATA.graphState.rebuiltAt + '</span>' +
        '<span class="badge">by = ' + DATA.graphState.rebuiltBy + '</span>' +
      '</div>' +
      '<div class="codelist">clew graph audit     # edge_id 全集比对（多/少/异常混合边）→ 不一致标脏\nclew graph rebuild   # 全量重建：SQLite 导出 CSV → Kùzu COPY FROM → 状态 clean</div>' +
      '<div class="faint" style="font-size:11px;margin-top:8px;line-height:1.7"><b>归档风险与对策（决策 #8）</b>：Kùzu 仓库 2025-10 起归档只读，最终版 0.11.3 功能冻结但完全可用（MIT、PyPI wheel 覆盖 cp38–cp314 含 macOS arm64、文档迁至 kuzudb.github.io）。本方案把 Kùzu 严格限定为「可整体移除的派生层」：SQLite 永远是唯一事实源，图可随时重建；若未来需要更换引擎，仅替换 graph.py 一个模块，主库与契约零改动。</div>' +
    '</div>' +
  '</div>';
}

render();
</script>
</body>
</html>
