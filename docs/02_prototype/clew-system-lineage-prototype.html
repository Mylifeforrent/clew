<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clew · System-Level Lineage Prototype (System / Dataset / Field Three-Level View)</title>
<style>
  /* ===== Clew Design Tokens (same set as docs/02_prototype/clew-hifi-prototype.html) ===== */
  :root {
    --page: #F8FAFC; --card: #FFFFFF; --subtle: #F1F5F9;
    --ink: #0F172A; --ink-soft: #334155; --ink-muted: #475569; --ink-faint: #64748B;
    --line: #E2E8F0; --line-strong: #CBD5E1; --line-soft: #F1F5F9;
    --brand-50: #FFF7ED; --brand-100: #FFEDD5; --brand-200: #FED7AA; --brand-300: #FDBA74;
    --brand-400: #FB923C; --brand-500: #F97316; --brand-600: #EA580C; --brand-700: #C2410C;
    --brand-800: #9A3412; --brand-900: #7C2D12;
    --success: #15803D; --success-soft: #F0FDF4; --success-deep: #166534;
    --warning: #B45309; --warning-soft: #FFFBEB; --warning-deep: #92400E;
    --danger: #DC2626; --danger-soft: #FEF2F2; --danger-deep: #B91C1C;
    --info: #2563EB; --info-soft: #EFF6FF; --info-deep: #1E40AF;
    --ai: #4F46E5; --ai-soft: #EEF2FF; --ai-deep: #3730A3;
    --lineage-imported: #475569; --lineage-manual: #0D9488; --lineage-ai: #4F46E5;
    --lineage-derived: #94A3B8; --lineage-focus: #EA580C;
    --radius: 8px; --radius-lg: 12px;
    --shadow-card: 0 1px 2px rgba(15,23,42,.05);
    --shadow-pop: 0 10px 30px rgba(15,23,42,.14), 0 2px 6px rgba(15,23,42,.08);
    --shadow-node: 0 1px 3px rgba(15,23,42,.10);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--page); color: var(--ink);
    font-family: -apple-system, "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 13px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--brand-100); }
  button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--brand-600); outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  [hidden] { display: none !important; }

  /* ===== Common components ===== */
  .btn {
    appearance: none; display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink-soft); font: inherit; font-size: 12.5px;
    cursor: pointer; transition: background .15s ease, border-color .15s ease, color .15s ease;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--line-strong); background: var(--subtle); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary { background: var(--brand-700); border-color: var(--brand-700); color: #fff; }
  .btn-primary:hover { background: var(--brand-800); border-color: var(--brand-800); }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--ink-muted); }
  .btn-ghost:hover { background: var(--subtle); color: var(--ink-soft); }
  .btn-xs { padding: 2px 8px; font-size: 11.5px; border-radius: 5px; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px;
    border-radius: 999px; font-size: 11px; border: 1px solid var(--line);
    color: var(--ink-muted); background: var(--subtle); white-space: nowrap;
  }
  .badge-ok { background: var(--success-soft); color: var(--success-deep); border-color: transparent; }
  .badge-warn { background: var(--warning-soft); color: var(--warning-deep); border-color: transparent; }
  .badge-danger { background: var(--danger-soft); color: var(--danger-deep); border-color: transparent; }
  .badge-info { background: var(--info-soft); color: var(--info-deep); border-color: transparent; }
  .badge-ai { background: var(--ai-soft); color: var(--ai-deep); border-color: transparent; }
  .badge-brand { background: var(--brand-50); color: var(--brand-800); border-color: var(--brand-200); }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); }
  .input, .select {
    font: inherit; font-size: 12.5px; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; width: 100%;
    transition: border-color .15s ease;
  }
  .input:focus, .select:focus { border-color: var(--brand-600); outline: none; box-shadow: 0 0 0 3px rgba(234,88,12,.12); }
  .input::placeholder { color: var(--ink-faint); }
  code, pre, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .muted { color: var(--ink-muted); } .faint { color: var(--ink-faint); }
  .sep { height: 1px; background: var(--line-soft); margin: 10px 0; }

  /* ===== App shell ===== */
  #app { height: 100%; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    background: var(--card); border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; cursor: pointer; }
  .logo-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--brand-800);
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .navpill { display: flex; gap: 3px; background: var(--subtle); border-radius: 9px; padding: 3px; }
  .navpill button {
    appearance: none; border: none; background: transparent; color: var(--ink-muted);
    font: inherit; font-size: 12.5px; padding: 4px 12px; border-radius: 7px; cursor: pointer;
    transition: all .15s ease;
  }
  .navpill button:hover { color: var(--ink); }
  .navpill button.active { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: var(--shadow-card); }
  .navpill button:disabled { opacity: .4; cursor: not-allowed; }
  .searchbox {
    display: flex; align-items: center; gap: 6px; flex: 1; max-width: 330px;
    border: 1px solid var(--line); border-radius: 7px; padding: 4px 10px; background: var(--card);
  }
  .searchbox input { all: unset; font: inherit; font-size: 12.5px; color: var(--ink); flex: 1; }
  .userchip { display: flex; align-items: center; gap: 8px; }
  .main { flex: 1; min-height: 0; display: flex; }

  /* ===== Canvas ===== */
  .canvas-screen { display: flex; flex-direction: column; height: 100%; flex: 1; min-width: 0; }
  .canvas-toolbar {
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 8px 14px;
    background: var(--card); border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .canvas-area { flex: 1; position: relative; overflow: hidden; background: var(--page); }
  .canvas-area::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(circle, rgba(148,163,184,.35) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  .canvas-inner { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  #edgeSvg { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }
  #edgeSvg .edge-hit { pointer-events: stroke; cursor: pointer; }
  #edgeSvg .edge-visible { pointer-events: none; }

  .side { width: 230px; border-right: 1px solid var(--line); background: var(--card); padding: 10px;
    overflow: auto; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; }
  .side h4 { margin: 0 0 6px; font-size: 11px; font-weight: 600; color: var(--ink-muted); letter-spacing: .3px; }
  .side-item { padding: 7px 8px; border-radius: 7px; cursor: pointer; border: 1px solid transparent; transition: all .15s ease; }
  .side-item:hover { background: var(--subtle); }
  .side-item.active { border-color: var(--line); background: var(--subtle); }
  .side-item .nm { font-size: 12.5px; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; }
  .side-item .nm b { font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-item .sub { font-size: 10.5px; color: var(--ink-faint); margin-top: 1px; }
  .side-item .count { margin-left: auto; font-size: 10.5px; color: var(--ink-faint); }
  .type-mark {
    width: 20px; height: 20px; border-radius: 6px; display: inline-flex; align-items: center;
    justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0;
  }
  .tm-source { background: #EFF6FF; color: #1E40AF; }
  .tm-application { background: #F0FDF4; color: #166534; }
  .tm-warehouse { background: #FFF7ED; color: #9A3412; }
  .tm-bi { background: #EEF2FF; color: #3730A3; }
  .tm-external { background: #FEF2F2; color: #B91C1C; }
  .tm-other { background: var(--subtle); color: var(--ink-muted); }

  .detail { width: 330px; border-left: 1px solid var(--line); background: var(--card); padding: 12px;
    overflow: auto; flex-shrink: 0; }
  .detail h3 { margin: 0 0 4px; font-size: 14px; }
  .detail .sub { font-size: 11px; color: var(--ink-faint); margin-bottom: 10px; }
  .kv { display: flex; gap: 8px; font-size: 12px; margin: 3px 0; }
  .kv .k { width: 70px; color: var(--ink-faint); flex-shrink: 0; }
  .kv .v { color: var(--ink-soft); min-width: 0; }
  .sec-t { font-size: 11px; font-weight: 600; color: var(--ink-muted); margin: 14px 0 6px;
    display: flex; align-items: center; justify-content: space-between; }
  .anno { border-left: 2px solid var(--brand-200); padding: 2px 0 2px 9px; margin: 7px 0; font-size: 12px; color: var(--ink-soft); }
  .anno .meta { font-size: 10.5px; color: var(--ink-faint); margin-top: 2px; }
  .codelist { background: var(--subtle); border-radius: 7px; padding: 8px 10px; font-size: 10.5px;
    color: var(--ink-soft); white-space: pre-wrap; word-break: break-all; line-height: 1.55; }
  .updown { display: flex; flex-direction: column; gap: 3px; }
  .updown a { font-size: 12px; color: var(--brand-700); cursor: pointer; text-decoration: none; }
  .updown a:hover { text-decoration: underline; }
  .updown .hop { color: var(--ink-faint); font-size: 10.5px; }
  .evi { border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; margin: 6px 0;
    font-size: 11.5px; color: var(--ink-soft); cursor: pointer; transition: all .15s ease; background: var(--card); }
  .evi:hover { border-color: var(--brand-300); background: var(--brand-50); }
  .evi .f { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--ink); word-break: break-all; }
  .evi .m { color: var(--ink-faint); font-size: 10.5px; margin-top: 2px; }

  /* ===== System node ===== */
  .sys-node {
    position: absolute; width: 220px; background: var(--card);
    border: 1px solid var(--line-strong); border-radius: 12px;
    box-shadow: var(--shadow-node); cursor: pointer; user-select: none;
    transition: box-shadow .18s ease, border-color .18s ease, transform .18s ease;
  }
  .sys-node:hover { box-shadow: 0 4px 14px rgba(15,23,42,.12); transform: translateY(-1px); }
  .sys-node.selected { border-color: var(--brand-600); box-shadow: 0 0 0 1.5px var(--brand-600), 0 4px 16px rgba(234,88,12,.16); }
  .sys-node.seed { border-color: var(--brand-300); }
  .sys-node.dimmed { opacity: .35; }
  .sys-stripe { height: 3px; border-radius: 12px 12px 0 0; }
  .sys-body { padding: 10px 12px 11px; }
  .sys-head { display: flex; align-items: center; gap: 8px; }
  .sys-name { font-weight: 600; font-size: 13px; color: var(--ink); flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sys-id { font-size: 10px; color: var(--ink-faint); font-family: ui-monospace, Menlo, monospace; margin-top: 1px; }
  .sys-meta { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .sys-desc { font-size: 10.5px; color: var(--ink-faint); margin-top: 6px; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .hop-badge { position: absolute; top: -9px; right: 8px; font-size: 9.5px; padding: 1px 6px; border-radius: 999px;
    background: var(--brand-700); color: #fff; border: 2px solid var(--card); }
  .cycle-badge { position: absolute; top: -9px; left: 8px; font-size: 9.5px; padding: 1px 6px; border-radius: 999px;
    background: var(--warning-soft); color: var(--warning-deep); border: 1px solid var(--warning); }

  /* ===== Dataset / field node ===== */
  .ds-node {
    position: absolute; width: 200px; background: var(--card);
    border: 1px solid var(--line-strong); border-radius: 10px;
    box-shadow: var(--shadow-node); cursor: pointer; user-select: none;
    transition: box-shadow .18s ease, border-color .18s ease;
  }
  .ds-node:hover { box-shadow: 0 4px 14px rgba(15,23,42,.12); }
  .ds-node.selected { border-color: var(--brand-600); box-shadow: 0 0 0 1.5px var(--brand-600), 0 4px 16px rgba(234,88,12,.16); }
  .ds-node.dimmed { opacity: .35; }
  .ds-head { display: flex; align-items: center; gap: 7px; padding: 8px 9px; border-bottom: 1px solid var(--line-soft); }
  .ds-name { font-weight: 600; font-size: 12px; color: var(--ink); flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ds-id { font-size: 9.5px; color: var(--ink-faint); font-family: ui-monospace, Menlo, monospace; }
  .ds-sys { font-size: 9.5px; color: var(--ink-faint); padding: 0 5px; border-radius: 4px; background: var(--subtle); }
  .field-row { display: flex; align-items: center; gap: 6px; padding: 0 9px; height: 24px;
    border-bottom: 1px solid var(--line-soft); cursor: pointer; position: relative; transition: background .15s ease; }
  .field-row:last-child { border-bottom: none; }
  .field-row:hover { background: var(--subtle); }
  .field-row.selected { background: var(--brand-50); }
  .field-row.in-chain { background: var(--brand-50); }
  .fname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 11.5px; color: var(--ink-soft); }
  .ftype { font-size: 9.5px; color: var(--ink-faint); font-family: ui-monospace, Menlo, monospace; }
  .f-dot { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid var(--line-strong); flex-shrink: 0; }
  .field-row.selected .f-dot, .field-row.in-chain .f-dot { border-color: var(--brand-600); background: var(--brand-100); }

  /* ===== Legend / zoom / edge drawer ===== */
  .legend { position: absolute; left: 12px; bottom: 12px; background: rgba(255,255,255,.94);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 11px;
    color: var(--ink-muted); display: flex; flex-direction: column; gap: 4px; pointer-events: none; z-index: 3; }
  .legend .lg-row { display: flex; align-items: center; gap: 7px; }
  .lg-line { width: 26px; height: 0; border-top: 2px solid; flex-shrink: 0; }
  .zoomctl { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 4px; z-index: 3; }
  .zoomctl button { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--card); font-size: 14px; cursor: pointer; color: var(--ink-soft); }
  .zoomctl button:hover { background: var(--subtle); }

  .edge-drawer { position: absolute; left: 12px; right: 54px; bottom: 12px; max-height: 190px;
    background: rgba(255,255,255,.97); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow-pop); overflow: hidden; z-index: 4; display: flex; flex-direction: column; }
  .edge-drawer-head { display: flex; align-items: center; gap: 8px; padding: 7px 10px;
    border-bottom: 1px solid var(--line-soft); font-size: 11.5px; color: var(--ink-muted); }
  .edge-drawer-head b { color: var(--ink); font-size: 12px; }
  .edge-drawer-body { overflow: auto; }
  .edge-row { display: grid; grid-template-columns: 70px 1fr 78px 56px; gap: 8px; align-items: center;
    padding: 5px 10px; border-bottom: 1px solid var(--line-soft); font-size: 11.5px; cursor: pointer; }
  .edge-row:hover { background: var(--subtle); }
  .edge-row.active { background: var(--brand-50); }
  .edge-row .route { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--ink-soft);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .origin-explicit { color: var(--success-deep); background: var(--success-soft); }
  .origin-derived { color: var(--ink-muted); background: var(--subtle); }
  .origin-both { color: var(--info-deep); background: var(--info-soft); }
  .origin-ai { color: var(--ai-deep); background: var(--ai-soft); }

  /* ===== AI assistant drawer (specs: docs/04_hifi/07_system-level-ai-assistant.md) ===== */
  .ai-mask { position: fixed; inset: 0; background: rgba(15,23,42,.25); z-index: 69; animation: fadein .2s ease; }
  .ai-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 480px; max-width: 100vw;
    background: var(--card); border-left: 1px solid var(--line); box-shadow: var(--shadow-pop);
    z-index: 70; display: flex; flex-direction: column; animation: drawerin .2s ease; }
  @keyframes fadein { from { opacity: 0; } }
  @keyframes drawerin { from { transform: translateX(16px); opacity: 0; } }
  .ai-head { display: flex; align-items: center; gap: 8px; padding: 9px 14px;
    border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .ai-head h3 { margin: 0; font-size: 14px; flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
  .ai-ic { width: 30px; height: 30px; border-radius: 9px; background: var(--ai-soft); color: var(--ai);
    border: 1px solid rgba(79,70,229,.25); display: inline-flex; align-items: center;
    justify-content: center; font-size: 14px; flex-shrink: 0; }
  .ai-iconbtn { appearance: none; border: none; background: transparent; color: var(--ink-faint); font: inherit;
    font-size: 13px; width: 28px; height: 28px; border-radius: 7px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: background .15s ease, color .15s ease; }
  .ai-iconbtn:hover { background: var(--subtle); color: var(--ink-soft); }
  .ai-focus { display: flex; align-items: center; gap: 8px; padding: 0 14px; height: 34px; flex-shrink: 0;
    background: var(--page); border-bottom: 1px solid var(--line-soft); font-size: 11px; color: var(--ink-faint); }
  .ai-focus .fv { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: var(--info-deep);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ai-banner { margin: 10px 14px 0; padding: 8px 11px; flex-shrink: 0; border-radius: 9px;
    border: 1px solid rgba(180,83,9,.3); background: var(--warning-soft); color: var(--warning-deep);
    font-size: 12px; line-height: 1.55; animation: fadein .2s ease; }
  .ai-msgs { flex: 1; min-height: 0; overflow-y: auto; background: var(--page); padding: 14px;
    display: flex; flex-direction: column; gap: 11px; }
  .msg-row { display: flex; flex-direction: column; max-width: 100%; }
  .msg-row.me { align-items: flex-end; }
  .msg-who { font-size: 10.5px; color: var(--ink-faint); margin-bottom: 3px;
    font-family: ui-monospace, Menlo, monospace; letter-spacing: .08em; }
  .msg-bubble { max-width: 88%; border-radius: 12px; padding: 8px 11px; font-size: 12.5px;
    line-height: 1.62; white-space: pre-wrap; word-break: break-word; }
  .msg-row.me .msg-bubble { background: #EFF6FF; border: 1px solid #BFDBFE; color: var(--ink); border-top-right-radius: 5px; }
  .msg-row.ai .msg-bubble { background: var(--card); border: 1px solid var(--line); color: var(--ink-soft);
    border-top-left-radius: 5px; max-width: 100%; }
  .msg-row.ai .msg-bubble.err { background: var(--danger-soft); border-color: rgba(220,38,38,.25); color: var(--danger-deep); }
  .msg-note { font-size: 11px; color: var(--ink-faint); font-style: italic; text-align: center; }
  .aispin { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid rgba(79,70,229,.25);
    border-top-color: var(--ai); display: inline-block; animation: aispin .8s linear infinite; flex-shrink: 0; }
  @keyframes aispin { to { transform: rotate(360deg); } }
  .tool-card { width: 100%; background: var(--page); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .tool-head { display: flex; align-items: center; gap: 7px; padding: 6px 9px; cursor: pointer;
    transition: background .15s ease; }
  .tool-head:hover { background: var(--subtle); }
  .tool-chip { flex-shrink: 0; font-size: 10px; padding: 0 6px; border-radius: 999px;
    border: 1px solid rgba(79,70,229,.25); background: var(--ai-soft); color: var(--ai-deep);
    font-family: ui-monospace, Menlo, monospace; }
  .tool-body { border-top: 1px solid var(--line-soft); padding: 7px 9px; }
  .mini-list { display: flex; flex-direction: column; gap: 4px; }
  .mini-hit { display: flex; align-items: center; gap: 7px; font-size: 11px; }
  .mini-hit .mono { font-size: 10.5px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mini-hit .score { margin-left: auto; flex-shrink: 0; color: var(--ink-faint); font-size: 10.5px; text-align: right; }
  .suggest-card { width: 100%; border: 1px dashed rgba(79,70,229,.5); background: rgba(238,242,255,.5);
    border-radius: 12px; padding: 9px 11px; }
  .graph-strip { width: 100%; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;

/* ---- Dataset-level lineage (SQLite edge table) ---- */

/* ============================================================
   Derivation: system edge = explicit edge ∪ dataset-edge projection
   ============================================================ */
function buildSystemEdges(includeCycle) {
  const map = new Map();
  DATASET_EDGES.forEach(e => {
    const fs = DATASET_MAP[e.from] && DATASET_MAP[e.from].systemId;
    const ts = DATASET_MAP[e.to] && DATASET_MAP[e.to].systemId;
    if (!fs || !ts || fs === ts) return;
    const key = fs + "->" + ts;
    if (!map.has(key)) {
      map.set(key, { from: fs, to: ts, origin: "derived", source: "derived", confidence: 1, evidence: [] });
    }
    const se = map.get(key);
    se.evidence.push(e);
    se.confidence = Math.min(se.confidence, e.confidence);
  });
  const explicit = EXPLICIT_SYSTEM_EDGES.concat(includeCycle ? [CYCLE_EDGE] : []);
  explicit.forEach(x => {
    const key = x.from + "->" + x.to;
    const existing = map.get(key);
    if (existing) {
      map.set(key, Object.assign({}, existing, x, { origin: "both", evidence: existing.evidence }));
    } else {
      map.set(key, Object.assign({}, x, { origin: "explicit", evidence: [] }));
    }
  });
  return Array.from(map.values()).map(e => {
    const pairs = new Set(e.evidence.map(x => x.from + "->" + x.to));
    return Object.assign({}, e, {
      datasetEdgeCount: pairs.size,
      evidence: e.evidence.slice().sort((a, b) => a.id - b.id),
    });
  }).sort((a, b) => a.from.localeCompare(b.from) || a.to.localeCompare(b.to));
}

function toast(msg, kind) {
  const t = document.createElement("div");
  t.className = "toast " + (kind || "ok");
  t.textContent = msg;
  document.getElementById("toasts").appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

/* ---- System graph visibility: filters + closure + direction ---- */
function visibleSystemEdges() {
  return S.systemEdges.filter(e => {
    const f = S.filters;
    if (e.origin === "explicit" && !f.explicit) return false;
    if (e.origin === "derived" && !f.derived) return false;
    if (e.origin === "both" && !f.explicit && !f.derived) return false;
    if (e.source === "ai" && !f.ai) return false;
    return true;
  });
}
function systemClosure() {
  const edges = visibleSystemEdges();
  const adj = {};
  const add = (a, b) => { (adj[a] = adj[a] || []).push(b); };
  edges.forEach(e => {
    if (S.direction !== "down") add(e.to, e.from);  // Reverse: find upstream
    if (S.direction !== "up") add(e.from, e.to);    // Forward: find downstream
  });
  const hop = new Map([[S.seed, 0]]);
  const queue = [S.seed];
  while (queue.length) {
    const cur = queue.shift();
    const h = hop.get(cur);
    if (h >= S.hops) continue;
    (adj[cur] || []).forEach(nxt => {
      if (!hop.has(nxt)) { hop.set(nxt, h + 1); queue.push(nxt); }
    });
  }
  return hop;
}
function closureEdges(hop) {
  return visibleSystemEdges().filter(e => {
    if (!hop.has(e.from) || !hop.has(e.to)) return false;
    if (S.direction === "up") return hop.get(e.from) > hop.get(e.to);
    if (S.direction === "down") return hop.get(e.from) < hop.get(e.to);
    return true;
  });
}

/* ---- Simple cycle detection (for demonstrating system-level aggregate cycles) ---- */
function systemsInCycle() {
  const ids = new Set();
  const adj = {};
  S.systemEdges.forEach(e => { (adj[e.from] = adj[e.from] || []).push(e.to); });
  const visiting = new Set(), visited = new Set(), stack = [];
  function dfs(n) {
    if (visiting.has(n)) {
      const i = stack.indexOf(n);
      stack.slice(i).forEach(x => ids.add(x));
      return;
    }
    if (visited.has(n)) return;
    visiting.add(n); stack.push(n);
    (adj[n] || []).forEach(dfs);
    stack.pop(); visiting.delete(n); visited.add(n);
  }
  Object.keys(adj).forEach(dfs);
  return ids;
}

/* ---- Dataset view visibility ---- */
function visibleDatasets() {
  const hop = systemClosure();
  return DATASETS.filter(d => {
    if (S.showAllDatasets) return true;
    if (!d.systemId) return false;
    return hop.has(d.systemId);
  });
}
function visibleDatasetEdges() {
  const ids = new Set(visibleDatasets().map(d => d.id));
  return DATASET_EDGES.filter(e => ids.has(e.from) && ids.has(e.to));
}

/* ---- Field view: focus dataset + direct neighbors ---- */
function fieldViewData() {
  const focus = S.selectedDataset;
  const ids = new Set([focus]);
  const edges = DATASET_EDGES.filter(e => e.from === focus || e.to === focus);
  edges.forEach(e => { ids.add(e.from); ids.add(e.to); });
  const nodes = Array.from(ids).map(id => ds(id)).filter(Boolean);
  return { focus, nodes, edges };
}
function involvedFields(datasetId, edges, focus) {
  const names = new Set();
  edges.forEach(e => {
    if (e.from === datasetId) names.add(e.fromField);
    if (e.to === datasetId) names.add(e.toField);
  });
  if (datasetId === focus) return ds(datasetId).fields.map(f => f.name);
  return Array.from(names);
}

/* ============================================================
   Canvas: system view
   ============================================================ */
const SYS_W = 220, SYS_H = 96;
function drawCanvas() {
  const layer = document.getElementById("nodeLayer");
  const svg = document.getElementById("edgeSvg");
  if (!layer || !svg) return;
  if (S.level === "system") drawSystemGraph(layer, svg);
  else if (S.level === "dataset") drawDatasetGraph(layer, svg);
  else drawFieldGraph(layer, svg);
  applyView();
}

function edgeStyle(e, selected) {
  const ai = e.source === "ai";
  const derived = e.origin === "derived";
  let color = ai ? "#4F46E5" : derived ? "#94A3B8" : "#0D9488";
  let dash = ai ? "6 5" : derived ? "5 5" : "";
  if (selected) { color = "#EA580C"; dash = "7 4"; }
  return { color, dash, width: selected ? 2.8 : (ai ? 1.9 : 1.7) };
}

function drawSystemGraph(layer, svg) {
  const hop = systemClosure();
  const edges = closureEdges(hop);
  const cycleIds = systemsInCycle();
  const cycleEdgeKeys = new Set();
  if (S.demoCycle) cycleEdgeKeys.add(edgeKey(CYCLE_EDGE));

  layer.innerHTML = SYSTEMS.map(s => {
    if (!hop.has(s.id)) return "";
    const t = typeMeta(s.type);
    const selected = S.selectedSystem === s.id;
    const isSeed = S.seed === s.id;
    const count = DATASETS.filter(d => d.systemId === s.id).length;
    return '<div class="sys-node ' + (selected ? "selected" : "") + (isSeed ? " seed" : "") + '" style="left:' + s.x + 'px;top:' + s.y + 'px" ' +
      'onclick="delayedSelectSystem(\'' + s.id + '\')" ondblclick="drillSystemNow(\'' + s.id + '\')" title="Click for details, double-click to drill into datasets">' +
      '<div class="sys-stripe" style="background:' + t.stripe + '"></div>' +
      (isSeed ? '<span class="hop-badge">Seed</span>' : '<span class="hop-badge" style="background:var(--ink-muted)">hop ' + hop.get(s.id) + '</span>') +
      (cycleIds.has(s.id) ? '<span class="cycle-badge">Cycle</span>' : "") +
      '<div class="sys-body">' +
        '<div class="sys-head"><span class="type-mark ' + t.cls + '">' + t.mark + '</span>' +
          '<div style="min-width:0;flex:1"><div class="sys-name">' + esc(s.name) + '</div><div class="sys-id">' + s.id + '</div></div></div>' +
        '<div class="sys-meta"><span class="badge" style="font-size:9.5px">' + t.label + '</span>' +
          '<span class="badge" style="font-size:9.5px">' + count + ' datasets</span>' +
          (s.owner ? '<span class="badge" style="font-size:9.5px">' + esc(s.owner) + '</span>' : "") + '</div>' +
        '<div class="sys-desc">' + esc(s.desc) + '</div>' +
      '</div></div>';
  }).join("");

  const markers = ["#4F46E5", "#94A3B8", "#0D9488", "#EA580C", "#475569"].map(c =>
    '<marker id="ah' + c.slice(1) + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
    '<path d="M 0 0 L 10 5 L 0 10 z" fill="' + c + '"/></marker>').join("");
  let paths = edges.map(e => {
    const a = sys(e.from), b = sys(e.to);
    if (!a || !b) return "";
    const forward = a.x <= b.x;
    const x1 = forward ? a.x + SYS_W : a.x;
    const x2 = forward ? b.x : b.x + SYS_W;
    const y1 = a.y + SYS_H / 2, y2 = b.y + SYS_H / 2;
    const selected = S.selectedEdge === edgeKey(e);
    const st = edgeStyle(e, selected);
    const d = curvePath(x1, y1, x2, y2);
    const midX = (x1 + x2) / 2, midY = (y1 + y2) / 2 - 8;
    const label = e.source === "ai" ? "AI" : e.datasetEdgeCount > 0 ? "×" + e.datasetEdgeCount : "Explicit";
    const lw = label.length > 2 ? 42 : 30;
    const isCycle = cycleEdgeKeys.has(edgeKey(e)) || (cycleIds.has(e.from) && cycleIds.has(e.to));
    return '<g>' +
      '<path class="edge-hit" d="' + d + '" fill="none" stroke="transparent" stroke-width="16" onclick="selectEdge(\'' + edgeKey(e) + '\')"><title>' + esc(edgeTitle(e)) + '</title></path>' +
      '<path class="edge-visible" d="' + d + '" fill="none" stroke="' + st.color + '" stroke-width="' + st.width + '"' +
        (st.dash ? ' stroke-dasharray="' + st.dash + '"' : "") +
        ' marker-end="url(#ah' + st.color.slice(1) + ')" opacity="' + (selected ? "1" : "0.9") + '"></path>' +
      '<rect x="' + (midX - lw / 2) + '" y="' + (midY - 9) + '" width="' + lw + '" height="16" rx="8" fill="#fff" stroke="' + st.color + '" stroke-opacity=".35"></rect>' +
      '<text x="' + midX + '" y="' + (midY + 2) + '" text-anchor="middle" font-size="9" fill="' + st.color + '">' + esc(label) + '</text>' +
      (isCycle ? '<text x="' + (midX + lw / 2 + 6) + '" y="' + (midY + 2) + '" font-size="9" fill="#B45309">Cycle</text>' : "") +
    '</g>';
  }).join("");
  const W = 1500, H = 760;
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.innerHTML = "<defs>" + markers + "</defs>" + paths;
  // Canvas container size
  const inner = document.getElementById("canvasInner");
  if (inner) { inner.style.width = W + "px"; inner.style.height = H + "px"; }
}
function curvePath(x1, y1, x2, y2) {
  const dx = Math.max(42, Math.abs(x2 - x1) * 0.45);
  const sign = x2 >= x1 ? 1 : -1;
  return "M " + x1 + " " + y1 + " C " + (x1 + dx * sign) + " " + y1 + ", " + (x2 - dx * sign) + " " + y2 + ", " + x2 + " " + y2;
}
function edgeTitle(e) {
  const parts = [e.from + " → " + e.to, "Source: " + (e.source === "ai" ? "AI candidate" : ORIGIN_LABEL[e.origin])];
  if (e.datasetEdgeCount) parts.push("Dataset-level evidence: " + e.datasetEdgeCount);
  if (e.transform) parts.push("Interface: " + e.transform);
  if (e.note) parts.push("Note: " + e.note);
  parts.push("Confidence: " + e.confidence.toFixed(2));
  return parts.join("\n");
}

/* ============================================================
   Canvas: dataset view

const DS_W = 200;
function dsHeight(d, expanded) {
  if (!expanded) return 64;
  return 42 + d.fields.length * 24 + 6;
}
function drawDatasetGraph(layer, svg) {
  const datasets = visibleDatasets();
  const edges = visibleDatasetEdges();
  const ids = new Set(datasets.map(d => d.id));

  layer.innerHTML = datasets.map(d => {
    const s = d.systemId ? sys(d.systemId) : null;
    const t = s ? typeMeta(s.type) : typeMeta("other");
    const isExpanded = !!expanded[d.id];
    const selected = S.selectedDataset === d.id;
    const rows = isExpanded ? d.fields.map(f =>
      '<div class="field-row ' + (S.selectedField && S.selectedField.ds === d.id && S.selectedField.f === f.name ? "selected" : "") +
      '" onclick="event.stopPropagation();selectField(\'' + d.id + '\',\'' + f.name + '\')">' +
      '<span class="f-dot"></span><span class="fname">' + esc(f.name) + '</span><span class="ftype">' + esc(f.type) + '</span></div>'
    ).join("") : "";
    return '<div class="ds-node ' + (selected ? "selected" : "") + '" style="left:' + d.x + 'px;top:' + d.y + 'px" ' +
      'onclick="delayedSelectDataset(\'' + d.id + '\')" ondblclick="drillDatasetNow(\'' + d.id + '\')" title="Click for details, double-click to open the field view">' +
      '<div class="ds-head" style="border-left:3px solid ' + t.color + '">' +
        '<div style="min-width:0;flex:1"><div class="ds-name">' + esc(d.name) + '</div><div class="ds-id">' + d.id + '</div></div>' +
        '<span class="ds-sys">' + (s ? esc(s.name) : "Unassigned") + '</span>' +
      '</div>' + rows +
      (isExpanded ? "" : '<div class="faint" style="padding:5px 9px;font-size:10px;border-top:1px solid var(--line-soft)">' + d.fields.length + ' fields · double-click for field view</div>') +
    '</div>';
  }).join("");
  const markers = ["#475569", "#0D9488", "#4F46E5", "#94A3B8", "#EA580C"].map(c =>
    '<marker id="dah' + c.slice(1) + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
    '<path d="M 0 0 L 10 5 L 0 10 z" fill="' + c + '"/></marker>').join("");
  const paths = edges.map(e => {
    const a = ds(e.from), b = ds(e.to);
    if (!a || !b || !ids.has(a.id) || !ids.has(b.id)) return "";
    const ah = dsHeight(a, expanded[a.id]), bh = dsHeight(b, expanded[b.id]);
    const forward = a.x <= b.x;
    const x1 = forward ? a.x + DS_W : a.x;
    const x2 = forward ? b.x : b.x + DS_W;
    const y1 = a.y + ah / 2, y2 = b.y + bh / 2;
    const selected = S.selectedEdge === "ds:" + e.id;
    const color = selected ? "#EA580C" : e.source === "ai" ? "#4F46E5" : e.source === "manual" ? "#0D9488" : "#94A3B8";
    const dash = selected ? "7 4" : e.source === "ai" ? "6 5" : e.source === "manual" ? "" : "4 5";
    const d = curvePath(x1, y1, x2, y2);
    return '<g>' +
      '<path class="edge-hit" d="' + d + '" fill="none" stroke="transparent" stroke-width="14" onclick="selectDatasetEdge(' + e.id + ')"><title>' + esc(e.from + "." + e.fromField + " → " + e.to + "." + e.toField) + '</title></path>' +
      '<path class="edge-visible" d="' + d + '" fill="none" stroke="' + color + '" stroke-width="' + (selected ? 2.6 : 1.5) + '"' +
        (dash ? ' stroke-dasharray="' + dash + '"' : "") + ' marker-end="url(#dah' + color.slice(1) + ')" opacity=".88"></path>' +
    '</g>';
  }).join("");
  const W = 1560, H = 820;
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.innerHTML = "<defs>" + markers + "</defs>" + paths;
  const inner = document.getElementById("canvasInner");
  if (inner) { inner.style.width = W + "px"; inner.style.height = H + "px"; }
}

/* ============================================================
   Canvas: field view
   ============================================================ */
const FW = 240, FROW = 26, FHEAD = 40;
function drawFieldGraph(layer, svg) {
  const { focus, nodes, edges } = fieldViewData();
  const upstream = new Set(), downstream = new Set();
  edges.forEach(e => {
    if (e.to === focus) upstream.add(e.from);
    if (e.from === focus) downstream.add(e.to);
  });
  const positions = {};
  let uy = 40, dy = 40, fy = 40;
  nodes.forEach(n => {
    if (n.id === focus) { positions[n.id] = { x: 380, y: fy, fields: n.fields.map(f => f.name) }; return; }
    if (upstream.has(n.id) && downstream.has(n.id)) { positions[n.id] = { x: 700, y: dy, fields: involvedFields(n.id, edges, focus) }; dy += 180; return; }
    if (upstream.has(n.id)) { positions[n.id] = { x: 40, y: uy, fields: involvedFields(n.id, edges, focus) }; uy += 180; return; }
    if (downstream.has(n.id)) { positions[n.id] = { x: 720, y: dy, fields: involvedFields(n.id, edges, focus) }; dy += 180; return; }
    positions[n.id] = { x: 40, y: uy, fields: involvedFields(n.id, edges, focus) }; uy += 180;
  });
  const nodeH = id => FHEAD + positions[id].fields.length * FROW + 8;
  layer.innerHTML = nodes.map(n => {
    const p = positions[n.id];
    const s = n.systemId ? sys(n.systemId) : null;
    const t = s ? typeMeta(s.type) : typeMeta("other");
    const rows = p.fields.map(fname => {
      const f = n.fields.find(x => x.name === fname);
      if (!f) return "";
      const selected = S.selectedField && S.selectedField.ds === n.id && S.selectedField.f === fname;
      return '<div class="field-row ' + (selected ? "selected" : "") + '" onclick="selectField(\'' + n.id + '\',\'' + fname + '\')">' +
        '<span class="f-dot"></span><span class="fname">' + esc(fname) + '</span><span class="ftype">' + esc(f.type) + '</span></div>';
    }).join("");
    return '<div class="ds-node ' + (n.id === focus ? "selected" : "") + '" style="left:' + p.x + 'px;top:' + p.y + 'px;width:' + FW + 'px" ' +
      'onclick="selectDataset(\'' + n.id + '\')">' +
      '<div class="ds-head" style="border-left:3px solid ' + t.color + '">' +
        '<div style="min-width:0;flex:1"><div class="ds-name">' + esc(n.name) + '</div><div class="ds-id">' + n.id + '</div></div>' +
        '<span class="ds-sys">' + (s ? esc(s.name) : "Unassigned") + '</span>' +
      '</div>' + rows + '</div>';
  }).join("");
  const markers = ["#475569", "#0D9488", "#4F46E5", "#EA580C"].map(c =>
    '<marker id="fah' + c.slice(1) + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
    '<path d="M 0 0 L 10 5 L 0 10 z" fill="' + c + '"/></marker>').join("");
  const rowY = (nid, fname) => {
    const p = positions[nid];
    const idx = p.fields.indexOf(fname);
    return p.y + FHEAD + idx * FROW + FROW / 2;
  };
  const paths = edges.filter(e => positions[e.from] && positions[e.to]).map(e => {
    const a = positions[e.from], b = positions[e.to];
    const forward = a.x <= b.x;
    const x1 = forward ? a.x + FW : a.x;
    const x2 = forward ? b.x : b.x + FW;
    const y1 = rowY(e.from, e.fromField);
    const y2 = rowY(e.to, e.toField);
    const selected = S.selectedEdge === "ds:" + e.id;
    const color = selected ? "#EA580C" : e.source === "ai" ? "#4F46E5" : e.source === "manual" ? "#0D9488" : "#94A3B8";
    const dash = selected ? "7 4" : e.source === "ai" ? "6 5" : e.source === "manual" ? "" : "4 5";
    const d = curvePath(x1, y1, x2, y2);
    return '<g>' +
      '<path class="edge-hit" d="' + d + '" fill="none" stroke="transparent" stroke-width="14" onclick="selectDatasetEdge(' + e.id + ')"><title>' + esc(e.from + "." + e.fromField + " → " + e.to + "." + e.toField + "\n" + e.transform) + '</title></path>' +
      '<path class="edge-visible" d="' + d + '" fill="none" stroke="' + color + '" stroke-width="' + (selected ? 2.6 : 1.5) + '"' +
        (dash ? ' stroke-dasharray="' + dash + '"' : "") + ' marker-end="url(#fah' + color.slice(1) + ')" opacity=".9"></path>' +
    '</g>';
  }).join("");
  const W = 1120, H = 620;
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.innerHTML = "<defs>" + markers + "</defs>" + paths;
  const inner = document.getElementById("canvasInner");
  if (inner) { inner.style.width = W + "px"; inner.style.height = H + "px"; }
}

/* ============================================================
   Detail panel
   ============================================================ */
function detailHtml() {
  if (S.selectedEdge && S.selectedEdge.indexOf("->") >= 0 && S.level === "system") {
    const e = S.systemEdges.find(x => edgeKey(x) === S.selectedEdge);
    if (e) return systemEdgeDetail(e);
  }
  if (S.selectedEdge && S.selectedEdge.indexOf("ds:") === 0) {
    const id = +S.selectedEdge.slice(3);
    const e = DATASET_EDGES.find(x => x.id === id);
    if (e) return datasetEdgeDetail(e);
  }
  if (S.level === "system") {
    const s = sys(S.selectedSystem) || sys(S.seed);
    return systemDetail(s);
  }
  if (S.level === "dataset") {
    const d = ds(S.selectedDataset) || visibleDatasets()[0];
    return d ? datasetDetail(d) : "<h3>Datasets</h3><div class='faint'>No datasets in the current closure.</div>";
  }
  const d = ds(S.selectedDataset);
  return d ? fieldDetail(d, S.selectedField) : "<h3>Fields</h3><div class='faint'>Select a field.</div>";
}

  if (!s) return "<h3>System</h3><div class='faint'>Select a system.</div>";

  const downs = visibleEdges.filter(e => e.from === s.id);

  const hop = systemClosure();
  return '<h3>' + esc(s.name) + ' <span class="badge ' + t.cls + '" style="vertical-align:2px">' + t.label + '</span></h3>' +
    '<div class="sub">' + s.id + ' · ' + (s.owner || "No owner recorded") + ' · hop ' + (hop.get(s.id) != null ? hop.get(s.id) : "-") + '</div>' +
    '<div style="color:var(--ink-soft);font-size:12px;margin-bottom:10px">' + esc(s.desc) + '</div>' +
    '<div style="display:flex;gap:6px">' +
      '<button class="btn btn-primary" style="flex:1;justify-content:center" onclick="drillSystem(\'' + s.id + '\')">Drill into dataset view</button>' +

    '<div class="kv"><span class="k">Datasets</span><span class="v">' + datasets.length + '</span></div>' +

    '<div class="kv"><span class="k">Downstream systems</span><span class="v">' + downs.length + '</span></div>' +
    '<div class="kv"><span class="k">Adjacent system edges</span><span class="v">' + (ups.length + downs.length) + ' (incl. projected)</span></div>' +
    '<div class="sec-t">Upstream (' + ups.length + ')</div><div class="updown">' +
      (ups.length ? ups.map(e => '<a onclick="selectEdge(\'' + edgeKey(e) + '\')">' + e.from + ' → ' + s.id + ' <span class="hop">' + (e.source === "ai" ? "AI candidate" : ORIGIN_LABEL[e.origin]) + ' · evidence ' + e.datasetEdgeCount + '</span></a>').join("") : '<span class="faint" style="font-size:11px">Source system (no upstream)</span>') +
    '</div>' +
    '<div class="sec-t">Downstream (' + downs.length + ')</div><div class="updown">' +
      (downs.length ? downs.map(e => '<a onclick="selectEdge(\'' + edgeKey(e) + '\')">' + s.id + ' → ' + e.to + ' <span class="hop">' + (e.source === "ai" ? "AI candidate" : ORIGIN_LABEL[e.origin]) + ' · evidence ' + e.datasetEdgeCount + '</span></a>').join("") : '<span class="faint" style="font-size:11px">Leaf system (no downstream)</span>') +
    '</div>' +
    '<div class="sec-t">Datasets (' + datasets.length + ')</div>' +
    datasets.map(d => '<div class="evi" onclick="drillDataset(\'' + d.id + '\')"><div class="f">' + esc(d.name) + '</div><div class="m">' + d.id + ' · ' + d.fields.length + ' fields</div></div>').join("") +
    (annos.length ? '<div class="sec-t">System notes</div>' + annos.map(a => '<div class="anno">' + esc(a.body) + '<div class="meta">' + esc(a.author) + ' · ' + esc(a.at) + '</div></div>').join("") : "") +
    '<div class="sec-t">System-level query (Kùzu Cypher)</div>' +
    '<div class="codelist">' + esc('MATCH p = (s:System {id: "' + s.id + '"})\n  <-[:LINEAGE_SYSTEM*1..' + S.hops + ']-(up:System)\nRETURN DISTINCT up.id, min(length(p)) AS hop\nORDER BY hop;') + '</div>' +
    '<div class="faint" style="font-size:10.5px;margin-top:8px;line-height:1.6">System attributes come from SQLite; N-hop traversal runs on Kùzu. Dirty graphs are rebuilt automatically; on failure it falls back to the v_system_edge recursive CTE.</div>';

function goLevel(level) {

  readRebuild();

  S.selectedEdge = null;
  S.needsFit = true;

}
function onSearch(v) {

}
function switchRole(role) {

}
function setSeed(id) {
  readRebuild();

function setHops(v) { readRebuild(); S.hops = +v; render(); toast("Re-fetched system subgraph: *1.." + S.hops); }
function setDirection(v) { readRebuild(); S.direction = v; render(); }
function toggleFilter(k, v) { S.filters[k] = v; render(); }
function toggleAllDatasets(v) { readRebuild(); S.showAllDatasets = v; S.needsFit = true; render(); }
function toggleEdgeDrawer() { S.showEdgeDrawer = !S.showEdgeDrawer; render(); }
function selectSystem(id) {
  S.selectedSystem = id;
  S.selectedEdge = null;
  render();
}
function drillSystem(id) {
  readRebuild();
  S.selectedSystem = id;
  S.seed = id;
  S.selectedEdge = null;

  S.level = "dataset";

}
function selectDataset(id) {
  S.selectedDataset = id;

    const d = ds(id);

  }

}
function drillDataset(id) {
  readRebuild();
  S.selectedDataset = id;
  S.level = "field";
  S.selectedEdge = null;
  const d = ds(id);
  if (d && d.fields.length) S.selectedField = { ds: id, f: d.fields[0].name };

}
function selectField(dsid, fname) {
  S.selectedDataset = dsid;
  S.selectedField = { ds: dsid, f: fname };
  S.selectedEdge = null;
  if (S.level === "system") S.level = "dataset";
  render();
}
function selectEdge(key) {
  S.selectedEdge = key;
  const e = S.systemEdges.find(x => edgeKey(x) === key);
  if (e) S.selectedSystem = e.from;
  render();
}
function selectDatasetEdge(id) {
  S.selectedEdge = "ds:" + id;

  if (e) S.selectedDataset = e.from;
  render();
}
function jumpEvidence(id) {
  const e = DATASET_EDGES.find(x => x.id === id);
  if (!e) return;
  readRebuild();
  S.selectedDataset = e.from;
  S.selectedField = { ds: e.from, f: e.fromField };

function showUnassigned() {

function cycleGraphState() {
  S.graphState = S.graphState === "clean" ? "dirty" : S.graphState === "dirty" ? "cte" : "clean";
  render();
  const msg = S.graphState === "clean" ? "Kùzu graph rebuilt (COPY FROM, idempotent)" : S.graphState === "dirty" ? "Graph marked dirty; rebuilt automatically on the next read request" : "Kùzu unavailable: fell back to the SQLite v_system_edge recursive CTE";
  toast(msg, S.graphState === "clean" ? "ok" : "warn");
}
function toggleCycleDemo() {
  S.demoCycle = !S.demoCycle;
  S.systemEdges = buildSystemEdges(S.demoCycle);
  render();
  toast(S.demoCycle ? "Injected a system-level aggregate cycle (BI → warehouse); note: there is no reverse lineage at dataset level" : "Demo cycle removed", S.demoCycle ? "warn" : "ok");
}
function zoomBy(k) { S.zoom = Math.min(2, Math.max(0.4, S.zoom * k)); applyView(); }
function focusCanvas(level) {
  const area = document.getElementById("canvasArea");
  if (!area) return;
  const aw = area.clientWidth || 900;
  const ah = area.clientHeight || 700;
  if (level === "system") {
    const xs = SYSTEMS.map(s => s.x), ys = SYSTEMS.map(s => s.y);
    const minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs) + SYS_W;
    const minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys) + SYS_H;
    const pad = 22;
    const z = Math.max(0.52, Math.min(0.95, (aw - pad * 2) / (maxX - minX), (ah - pad * 2) / (maxY - minY)));
    S.zoom = z;
    S.panX = Math.round(pad - minX * z);
    S.panY = Math.round(pad - minY * z);
  } else if (level === "dataset") {
    const d = ds(S.selectedDataset) || visibleDatasets()[0] || DATASETS[0];
    S.zoom = 0.72;
    S.panX = Math.round(aw / 2 - (d.x + DS_W / 2) * S.zoom);
    S.panY = Math.round(ah / 2 - (d.y + 60) * S.zoom);
  } else {
    S.zoom = 0.9;
    S.panX = Math.round(aw / 2 - (380 + FW / 2) * S.zoom);
    S.panY = Math.round(ah / 2 - 150 * S.zoom);
  }
  applyView();
}
function resetView() { S.needsFit = false; focusCanvas(S.level); }
function applyView() {
  const el = document.getElementById("canvasInner");
  if (el) el.style.transform = "translate(" + S.panX + "px," + S.panY + "px) scale(" + S.zoom + ")";
}
let panning = null;
function panStart(ev) {
  if (ev.target.closest(".sys-node") || ev.target.closest(".ds-node") || ev.target.closest(".zoomctl") || ev.target.closest(".edge-drawer")) return;
  panning = { x: ev.clientX, y: ev.clientY, px: S.panX, py: S.panY };
  const move = e2 => {
    if (!panning) return;
    S.panX = panning.px + (e2.clientX - panning.x);
    S.panY = panning.py + (e2.clientY - panning.y);
    applyView();
  };
  const up = () => { panning = null; window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); };
  window.addEventListener("mousemove", move); window.addEventListener("mouseup", up);
}
document.addEventListener("wheel", ev => {
  const area = ev.target.closest && ev.target.closest(".canvas-area");
  if (!area) return;
  ev.preventDefault();
  zoomBy(ev.deltaY < 0 ? 1.08 : 0.92);
}, { passive: false });

    '<div class="arch-grid">' +

        '<ul>' +
          '<li><code>system</code>: system catalog (name/type/owner/description)</li>' +
          '<li><code>dataset.system_id</code>: dataset ownership</li>' +
          '<li><code>system_edge</code>: explicit system edges (interface/confidence/source)</li>' +
          '<li><code>v_system_edge</code>: explicit edges ∪ dataset-edge projection</li>' +
          '<li><code>change_log</code>: versions and rollback for systems/ownership/system edges</li>' +
        '</ul>' +
      '</div>' +
      '<div class="arch-box">' +
        '<h4><span class="arch-tag badge-brand">Kùzu · derived layer</span>Relationship instances + path traversal</h4>' +
        '<ul>' +
          '<li><code>System</code> nodes: store only id/name/type</li>' +
          '<li><code>LINEAGE_SYSTEM</code>: system-level relationship instances</li>' +
          '<li><code>Dataset.system_id</code>: ownership attribute used for drill-down filtering</li>' +
          '<li>N hops: <code>*1..n</code> variable-length paths + <code>min(length(p))</code></li>' +
          '<li>Can be fully rebuilt from SQLite at any time and removed entirely</li>' +
        '</ul>' +
      '</div>' +
      '<div class="arch-box">' +
        '<h4><span class="arch-tag badge-ok">Same rendering protocol</span>No separate stack</h4>' +
        '<ul>' +
          '<li><code>SystemGraphPayload</code> is isomorphic to <code>GraphPayload</code></li>' +
          '<li>Same canvas: system / dataset / field three-level switching</li>' +
          '<li>Same filters, zoom, details and edge list</li>' +
          '<li>AI graph updates and manual browsing share <code>applyGraph</code></li>' +
          '<li>No new services, message queues or search clusters</li>' +
        '</ul>' +
      '</div>' +
    '</div>' +
    '<div class="flowrow"><b>GET /lineage/systems</b><span>→</span><b>Graph router</b><span>(clean → Kùzu; dirty → auto rebuild; failure → CTE fallback)</span><span>→</span><b>SystemGraphPayload</b><span>→</span><b>Same canvas</b></div>' +
    '<div style="display:flex;gap:12px;align-items:stretch">' +
      '<div class="principle" style="background:var(--brand-50);border:1px solid var(--brand-200)">' +
        '<div class="pt"><span class="pn" style="background:var(--brand-700)">1</span>System edges are explainable</div>' +
        'Every system edge must carry <code>origin</code> (explicit/derived/both) and <code>dataset_edge_count</code>; projected edges can list their underlying dataset edges, and explicit edges may lack dataset evidence, but a \"line with an unexplainable source\" is not allowed.' +
      '</div>' +
      '<div class="principle" style="background:var(--info-soft);border:1px solid #BFDBFE">' +
        '<div class="pt"><span class="pn" style="background:var(--info-deep)">2</span>Projections are not persisted</div>' +
        'Dataset edges + <code>dataset.system_id</code> are projected into system edges in real time, avoiding dual-write drift where \"a dataset edge changes but the system edge is forgotten\"; only explicit edges are persisted in <code>system_edge</code> and versioned.' +
      '</div>' +
      '<div class="principle" style="background:var(--warning-soft);border:1px solid #FDE68A">' +
        '<div class="pt"><span class="pn" style="background:var(--warning-deep)">3</span>Cycles are detected, not blocked</div>' +
        'No cycle at dataset level does not mean no cycle at system level: aggregation can create cycles. Queries use <code>DISTINCT</code> + <code>min(hop)</code> + a hop limit; the UI marks a \"system-level aggregate cycle\" and never concludes from it that a dataset-level cycle exists.' +
      '</div>' +
    '</div>' +
    '<div class="sec-t" style="margin-top:14px">Key SQL / Cypher</div>' +
    '<div class="codelist">' + esc(
      '-- SQLite: system-level relationship view (explicit ∪ projected)\n' +
      'CREATE VIEW v_system_edge AS\n' +
      'WITH derived AS (\n' +
      '  SELECT d_from.system_id AS from_system, d_to.system_id AS to_system,\n' +
      '         COUNT(DISTINCT e.from_dataset || \'->\' || e.to_dataset) AS dataset_edge_count\n' +
      '  FROM edge e JOIN dataset d_from ON d_from.id = e.from_dataset\n' +
      '              JOIN dataset d_to   ON d_to.id   = e.to_dataset\n' +
      '  WHERE d_from.system_id IS NOT NULL AND d_to.system_id IS NOT NULL\n' +
      '    AND d_from.system_id <> d_to.system_id\n' +
      '  GROUP BY 1, 2\n' +
      ')\n' +
      'SELECT ... FROM system_edge e LEFT JOIN derived d ...\n' +
      'UNION ALL SELECT ... FROM derived d LEFT JOIN system_edge e ...;\n\n' +
      '-- Kùzu: system-level N-hop upstream\n' +
      'MATCH p = (s:System {id: $sid})<-[:LINEAGE_SYSTEM*1..3]-(up:System)\n' +
      'RETURN DISTINCT up.id, min(length(p)) AS hop ORDER BY hop;'
    ) + '</div>' +
    '<div class="faint" style="font-size:11px;margin-top:10px;line-height:1.6">This prototype only validates interaction and information architecture; it does not mean the backend is implemented. The final design is in <code>docs/01_design/clew-design-proposal.md</code> §4.7 / §5.3 and <code>docs/01_design/clew-data-model.md</code> §3.3 / §10.</div>';
  modal("System-level lineage · the third view layer on the same layered architecture", html,
    '<button class="btn" onclick="toggleCycleDemo();closeModal();openArch()">' + (S.demoCycle ? "Remove demo cycle" : "Inject system-level cycle (demo)") + '</button>' +
    '<button class="btn btn-primary" onclick="closeModal()">Close</button>');
}

      { t: "ai", x: "1 system-level candidate edge suggested: payment_gateway → finance (channel reconciliation, conf 0.58).\n\nBasis: Payment Gateway's payment transactions and Finance's settlement transactions both use pay_id as the reconciliation key, but no relationship between the two systems is currently registered (no projection, no explicit edge). The candidate is persisted to system_edge (source='ai') and shown as an indigo dashed line on the canvas.\n\nGovernance: an editor or above must confirm before it becomes manual; both confirm and reject write change_log, mark the Kùzu graph dirty, and trigger an automatic rebuild on the next read request. Use the candidate card above, or find the \"AI candidate\" row in the \"Relationship instances\" list.\n\nAlso: the canvas already has 1 pending candidate, crm → marketing (conf 0.62, tag-targeting inference)." },
    ],
  },
  {
    q: "How is the gmv metric calculated?",
    steps: [
      { t: "tool", n: "trace_lineage", a: 'field="dws_order_daily.gmv", direction="up", hops=3', h:
        '<div class="mini-list">' +
        '<div class="mini-hit"><span class="badge badge-ok" style="font-size:10px">hop 1</span><span class="mono">dwd_order.order_amount</span><span class="score">Imported · conf 1.00 · SUM(order_amount)</span></div>' +
        '<div class="mini-hit"><span class="badge badge-info" style="font-size:10px">hop 2</span><span class="mono">ods_raw_order.quantity / unit_price</span><span class="score">Imported · conf 1.00 · quantity × unit_price</span></div>' +
        '<div class="mini-hit"><span class="badge badge-info" style="font-size:10px">hop 3</span><span class="mono">ods_order.amount</span><span class="score">Imported · conf 0.98 · amount definition alignment</span></div>' +
        '</div>' },
      { t: "graph", g: { level: "field", ds: "dws_order_daily", f: "gmv", edge: 15 }, strip: "Field view · the 3-hop upstream chain of gmv is highlighted" },
      { t: "ai", x: "The 3-hop upstream chain of gmv (SQLite edge + Kùzu LINEAGE_FIELD):\n\n1. dws_order_daily.gmv ← dwd_order.order_amount: daily rollup via SUM(order_amount) (imported, conf 1.00)\n2. dwd_order.order_amount ← ods_raw_order.quantity × unit_price (imported, conf 1.00)\n3. ods_raw_order.amount ← ods_order.amount: amount definition alignment (imported, conf 0.98)\n\nThe canvas has switched to the field view and the whole chain is highlighted; click any field on the chain to verify it at the source. Tip: the 0.98 at hop 3 is the \"order amount ↔ detail amount\" definition-alignment edge — when changing the amount definition, assess impact along this chain." },
    ],
  },
];

/* ---- Step execution ---- */
function startChain(steps) {
  aiBusy = true;
  aiChain = steps.slice();
  aiTimer = setTimeout(aiNextStep, 500);
  renderAi();
}
function aiNextStep() {
  if (!aiChain.length) { aiBusy = false; renderAi(); return; }
  const st = aiChain.shift();
  applyStep(st);
  renderAi();
  if (aiChain.length) aiTimer = setTimeout(aiNextStep, 600);
  else { aiBusy = false; renderAi(); }
}
function applyStep(st) {
  if (st.t === "tool") { aiLog.push({ who: "tool", n: st.n, a: st.a, h: st.h, open: false, ok: st.ok !== false }); return; }
  if (st.t === "ai") { aiLog.push({ who: "ai", text: st.x, err: !!st.err }); return; }
  if (st.t === "note") { aiLog.push({ who: "note", text: st.x }); return; }
  if (st.t === "strip") { aiLog.push({ who: "strip", text: st.strip }); return; }
  if (st.t === "suggest") {
    const key = st.from + "->" + st.to;
    if (!EXPLICIT_SYSTEM_EDGES.some(x => edgeKey(x) === key)) {
      EXPLICIT_SYSTEM_EDGES.push({
        from: st.from, to: st.to, source: "ai", confidence: st.conf,
        transform: "Channel reconciliation (inferred)",
        note: "AI suggestion: the payment gateway reconciliation statement appears to share a reconciliation interface with finance settlement; pending editor confirmation to become manual.",
      });
      S.systemEdges = buildSystemEdges(S.demoCycle);
    }
    aiLog.push({ who: "suggest", key: key, from: st.from, to: st.to, conf: st.conf, reason: st.reason });
    render();   // The candidate dashed edge appears on the canvas immediately
    return;
  }
  if (st.t === "graph") {
    const g = st.g;
    if (g.level) S.level = g.level;
    if (g.seed) S.seed = g.seed;
    if (g.direction) S.direction = g.direction;
    if (g.hops) S.hops = g.hops;
    if (g.ds) {
      S.selectedDataset = g.ds;
      const d = ds(g.ds);
      if (g.f && d && d.fields.some(x => x.name === g.f)) S.selectedField = { ds: g.ds, f: g.f };
    }
    if (g.edge) { const e = DATASET_EDGES.find(x => x.id === g.edge); if (e) S.selectedDataset = e.from; }
    S.selectedEdge = g.edge ? "ds:" + g.edge : (g.selectedEdge || null);
    if (g.level === "system") S.selectedSystem = g.selectedEdge ? g.selectedEdge.split("->")[0] : S.seed;
    S.needsFit = true;
    render();
    if (st.strip) aiLog.push({ who: "strip", text: st.strip });
    return;
  }
}
function runFlow(i) {
  if (aiBusy || !aiConfigured()) return;
  const f = AI_FLOWS[i];
  aiLog.push({ who: "me", text: f.q });
  startChain(f.steps.slice());
}
function stopAi() {
  clearTimeout(aiTimer);
  aiChain = [];
  aiBusy = false;
  aiLog.push({ who: "note", text: "This answer was stopped (unfinished tool calls and output discarded)" });
  renderAi();
}
function sendAi() {
  if (aiBusy) return;
  const inp = document.getElementById("aiInput");
  const q = (inp.value || "").trim();
  if (!q) return;
  inp.value = "";
  if (!aiConfigured()) {
    aiLog.push({ who: "me", text: q });
    aiLog.push({ who: "ai", err: true, text: "503 service not configured: .env is missing LLM_BASE_URL / LLM_MODEL; the AI assistant is temporarily unavailable. After configuring, click ⟳ in the top-right corner to re-check." });
    renderAi();
    return;
  }
  const qk = q.toLowerCase();
  const hits = SYSTEMS.filter(s =>
    s.id.toLowerCase().includes(qk) || s.name.toLowerCase().includes(qk) || (s.owner || "").toLowerCase().includes(qk));
  aiLog.push({ who: "me", text: q });
  startChain([
    { t: "tool", n: "search_systems", a: JSON.stringify(q), h:
      (hits.length
        ? '<div class="mini-list">' + hits.slice(0, 4).map(s =>
            '<div class="mini-hit"><span class="badge" style="font-size:10px">Match</span><span class="mono">' + esc(s.id) + '</span><span class="score">' + esc(s.name) + ' · ' + typeMeta(s.type).label + '</span></div>').join("") + '</div>'
        : '<div class="faint" style="font-size:11px">No matching systems via SQLite LIKE.</div>') },
    { t: "ai", x: "This prototype is a scripted demo: click a sample question to see the full \"tool call → answer → canvas linkage\" flow (path Q&A / edge-evidence explanation / suggestion generation / field-level tracing). For free-form input I only demo the live search_systems query (the SQLite LIKE results above). In production the answer is composed by an LLM via function calling; see Clew design proposal §6." },
  ]);
}
function aiKey(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    if (!aiBusy) sendAi();
  }
}
function aiCount(el) {
  const n = (el.value || "").length;
  const c = document.getElementById("aiCount");
  if (c) { c.textContent = n + "/8000"; c.style.color = n >= 8000 ? "var(--danger-deep)" : ""; }
}
function toggleAiTool(i) {
  const m = aiLog[i];
  if (m && m.who === "tool") m.open = !m.open;
  renderAi();
}

/* ---- System-level suggestion edge lifecycle: confirm → manual / reject → delete ---- */
function aiConfirmSuggest(key, idx) {
  if (!canWrite()) return;
  const e = EXPLICIT_SYSTEM_EDGES.find(x => edgeKey(x) === key && x.source === "ai");
  if (!e) return;
  e.source = "manual";
  S.systemEdges = buildSystemEdges(S.demoCycle);
  const m = aiLog[idx];
  if (m && m.who === "suggest") m.state = "confirmed";
  markDirty("Confirmed and converted to manual: " + key + " (writes change_log)");
  render(); renderAi();
}
function aiRejectSuggest(key, idx) {
  if (!canWrite()) return;
  const i = EXPLICIT_SYSTEM_EDGES.findIndex(x => edgeKey(x) === key && x.source === "ai");
  if (i >= 0) EXPLICIT_SYSTEM_EDGES.splice(i, 1);
  S.systemEdges = buildSystemEdges(S.demoCycle);
  const m = aiLog[idx];
  if (m && m.who === "suggest") m.state = "rejected";
  markDirty("Rejected candidate edge: " + key + " (writes deleted log)");
  render(); renderAi();
}

/* ---- Drawer rendering (separate layer; canvas re-render does not lose input) ---- */
function aiMsgHtml(m, i) {
  if (m.who === "me") {
    return '<div class="msg-row me"><div class="msg-who">You</div><div class="msg-bubble">' + esc(m.text) + '</div></div>';
  }
  if (m.who === "ai") {
    return '<div class="msg-row ai"><div class="msg-who">✦ AI assistant</div><div class="msg-bubble' + (m.err ? " err" : "") + '">' + esc(m.text) + '</div></div>';
  }
  if (m.who === "note") return '<div class="msg-note">' + esc(m.text) + '</div>';
  if (m.who === "strip") {
    return '<div class="msg-row ai"><div class="graph-strip"><span class="badge badge-ok" style="font-size:10px">Canvas updated</span><span>' + esc(m.text) + '</span>' +
      '<button class="btn btn-xs" style="margin-left:auto" onclick="closeAi()">Close and view</button></div></div>';
  }
  if (m.who === "tool") {
    return '<div class="msg-row ai"><div class="tool-card">' +
      '<div class="tool-head" onclick="toggleAiTool(' + i + ')" aria-expanded="' + (m.open ? "true" : "false") + '">' +
        '<span class="tool-chip">tool <span style="color:' + (m.ok === false ? "var(--danger)" : "var(--success)") + '">' + (m.ok === false ? "✗" : "✓") + '</span></span>' +
        '<span class="mono" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(m.n + "(" + m.a + ")") + '</span>' +
        '<span class="faint" style="font-size:10px;flex-shrink:0">' + (m.open ? "Collapse ▲" : "Expand ▼") + '</span>' +
      '</div>' +
      (m.open ? '<div class="tool-body">' + m.h + '</div>' : "") +
    '</div></div>';
  }
  if (m.who === "suggest") {
    const resolved = m.state === "confirmed" ? '<span class="badge badge-ok">Confirmed → manual</span>'
      : m.state === "rejected" ? '<span class="badge">Rejected · not written to the source of truth</span>' : "";
    const editable = canWrite() && !m.state;
    const actions = m.state ? resolved :
      '<div style="display:flex;gap:6px;margin-top:7px;align-items:center;flex-wrap:wrap">' +
        '<button class="btn btn-primary btn-xs" ' + (editable ? "" : "disabled") + ' onclick="aiConfirmSuggest(\'' + m.key + '\',' + i + ')">✓ Confirm</button>' +
        '<button class="btn btn-xs" style="color:var(--danger-deep)" ' + (editable ? "" : "disabled") + ' onclick="aiRejectSuggest(\'' + m.key + '\',' + i + ')">Reject</button>' +
        (canWrite() ? "" : '<span class="faint" style="font-size:10.5px">Requires editor role (currently read-only view)</span>') +
      '</div>';
    return '<div class="msg-row ai"><div class="suggest-card">' +
      '<div style="font-size:10.5px;color:var(--ai-deep);letter-spacing:.06em">✦ AI assistant · suggest_system_lineage</div>' +
      '<div class="mono" style="font-size:11.5px;color:var(--ink-soft);margin-top:4px">' + esc(m.from) + ' → ' + esc(m.to) + '</div>' +
      '<div style="display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap">' +
        '<span class="badge badge-ai" style="font-size:10px">Conf ' + m.conf.toFixed(2) + '</span>' +
        '<span class="faint" style="font-size:11px">' + esc(m.reason) + '</span>' +
      '</div>' +
      actions +
      '<div class="faint" style="font-size:10px;margin-top:6px">After confirmation source changes from ai to manual · writes change_log · triggers Kùzu graph rebuild</div>' +
    '</div></div>';
  }
  return "";
}
function aiDrawerHtml() {
  const st = S.ai.status;
  const statusBadge = st === "ok"
    ? '<span class="badge badge-ai" title="GET /ai/status · .env LLM_MODEL">Configured · ' + AI_MODEL + '</span>'
    : st === "loading" ? '<span class="badge"><span class="aispin"></span>Checking</span>'
    : '<span class="badge" title="GET /ai/status · 503">Not configured</span>';
  const focus = aiFocusLabel();
  const banner = st === "none"
    ? '<div class="ai-banner">AI assistant is unavailable: .env is missing LLM_BASE_URL / LLM_MODEL. After configuring, click ⟳ in the top-right corner to re-check.</div>' : "";
  const prompts = aiLog.length === 1 && !aiBusy
    ? '<div class="ai-qs">' + AI_FLOWS.map((f, i) =>
        '<button class="qbtn" ' + (aiConfigured() ? "" : "disabled") + ' onclick="runFlow(' + i + ')" title="Click to demo this question">' + esc(f.q) + '</button>').join("") + '</div>'
    : "";
  const msgs = aiLog.map(aiMsgHtml).join("") + prompts +
    (aiBusy
      ? '<div class="msg-row ai"><div class="msg-bubble" style="border-style:dashed;background:rgba(255,255,255,.7);color:var(--ink-muted);display:inline-flex;align-items:center;gap:7px"><span class="aispin"></span>Calling tools and composing an answer…</div></div>'
      : "");
  const sendBtn = aiBusy
    ? '<button class="btn" style="flex-shrink:0;border-color:rgba(220,38,38,.35);color:var(--danger-deep)" onclick="stopAi()" title="Stop this answer">■ Stop</button>'
    : '<button class="btn btn-primary" style="flex-shrink:0" ' + (aiConfigured() ? "" : "disabled") + ' onclick="sendAi()">Send</button>';
  const placeholder = st === "ok" ? "Ask about lineage: system upstream/downstream / edge evidence / find missing lineage…"
    : st === "loading" ? "Reading AI status…"
    : "AI not configured: set LLM_BASE_URL / LLM_MODEL in .env to enable";
  return '<div class="ai-mask" onclick="closeAi()"></div>' +
    '<aside class="ai-drawer" role="dialog" aria-label="AI assistant">' +
      '<div class="ai-head">' +
        '<span class="ai-ic">✦</span>' +
        '<h3>AI assistant ' + statusBadge + '</h3>' +
        '<button class="ai-iconbtn" onclick="refreshAiStatus()" aria-label="Re-check AI status" title="Re-check after simulating an .env change">⟳</button>' +
        '<button class="ai-iconbtn" onclick="clearAi()" aria-label="Clear conversation" title="Clear conversation (confirm first)">🗑</button>' +
        '<button class="ai-iconbtn" onclick="closeAi()" aria-label="Close drawer" title="Close (Esc)">✕</button>' +
      '</div>' +
      '<div class="ai-focus"><span>Current focus</span><span class="fv" title="' + esc(focus || "") + '">' + esc(focus || "Not focused") + '</span><span style="flex:1"></span>' +
        '<span class="badge" title="Queries are live; write actions such as suggestions/drafts require editor">🔒 Read-only tools</span></div>' +
      banner +
      '<div class="ai-msgs" id="aiMsgs" role="log" aria-live="polite">' + msgs + '</div>' +
      '<div class="ai-input">' +
        '<div style="display:flex;gap:7px;align-items:flex-end">' +
          '<label for="aiInput" style="position:absolute;left:-9999px">Ask the AI assistant</label>' +
          '<textarea id="aiInput" class="input" rows="2" maxlength="8000" placeholder="' + placeholder + '" ' +
            (aiConfigured() && !aiBusy ? "" : "disabled") + ' onkeydown="aiKey(event)" oninput="aiCount(this)"></textarea>' +
          sendBtn +
        '</div>' +
        '<div class="ai-counter"><span>Enter to send · Shift+Enter for newline · only the latest 50 messages are sent</span><span id="aiCount" class="mono">0/8000</span></div>' +
      '</div>' +
    '</aside>';
}
function renderAi() {
  const layer = document.getElementById("aiLayer");
  if (!layer) return;
  if (!S.ai.open) { layer.innerHTML = ""; return; }
  const prevInput = document.getElementById("aiInput");
  const prevMsgs = document.getElementById("aiMsgs");
  const inputVal = prevInput ? prevInput.value : "";
  const atBottom = prevMsgs ? (prevMsgs.scrollHeight - prevMsgs.scrollTop - prevMsgs.clientHeight < 60) : true;
  const prevScroll = prevMsgs ? prevMsgs.scrollTop : 0;
  layer.innerHTML = aiDrawerHtml();
  const inp = document.getElementById("aiInput");
  if (inp) { inp.value = inputVal; aiCount(inp); }
  const sc = document.getElementById("aiMsgs");
  if (sc) sc.scrollTop = atBottom ? sc.scrollHeight : prevScroll;
  if (!prevInput && S.ai.status !== "loading" && inp) inp.focus();
}

/* ============================================================
   Startup
   ============================================================ */
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (document.getElementById("modal-ov")) return;   // Modal closes itself first
  if (S.ai.open) closeAi();
});
render();
</script>
</body>
