<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clew · 系统级血缘原型（系统 / 数据集 / 字段三级视图）</title>
<style>
  /* ===== Clew Design Tokens（与 docs/02_prototype/clew-hifi-prototype.html 同一套）===== */
  :root {
    --page: #F8FAFC; --card: #FFFFFF; --subtle: #F1F5F9;
    --ink: #0F172A; --ink-soft: #334155; --ink-muted: #475569; --ink-faint: #64748B;
    --line: #E2E8F0; --line-strong: #CBD5E1; --line-soft: #F1F5F9;
    --brand-50: #FFF7ED; --brand-100: #FFEDD5; --brand-200: #FED7AA; --brand-300: #FDBA74;
    --brand-400: #FB923C; --brand-500: #F97316; --brand-600: #EA580C; --brand-700: #C2410C;
    --brand-800: #9A3412; --brand-900: #7C2D12;
    --success: #15803D; --success-soft: #F0FDF4; --success-deep: #166534;
    --warning: #B45309; --warning-soft: #FFFBEB; --warning-deep: #92400E;
    --danger: #DC2626; --danger-soft: #FEF2F2; --danger-deep: #B91C1C;
    --info: #2563EB; --info-soft: #EFF6FF; --info-deep: #1E40AF;
    --ai: #4F46E5; --ai-soft: #EEF2FF; --ai-deep: #3730A3;
    --lineage-imported: #475569; --lineage-manual: #0D9488; --lineage-ai: #4F46E5;
    --lineage-derived: #94A3B8; --lineage-focus: #EA580C;
    --radius: 8px; --radius-lg: 12px;
    --shadow-card: 0 1px 2px rgba(15,23,42,.05);
    --shadow-pop: 0 10px 30px rgba(15,23,42,.14), 0 2px 6px rgba(15,23,42,.08);
    --shadow-node: 0 1px 3px rgba(15,23,42,.10);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--page); color: var(--ink);
    font-family: -apple-system, "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 13px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--brand-100); }
  button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--brand-600); outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  [hidden] { display: none !important; }

  /* ===== 通用组件 ===== */
  .btn {
    appearance: none; display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink-soft); font: inherit; font-size: 12.5px;
    cursor: pointer; transition: background .15s ease, border-color .15s ease, color .15s ease;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--line-strong); background: var(--subtle); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary { background: var(--brand-700); border-color: var(--brand-700); color: #fff; }
  .btn-primary:hover { background: var(--brand-800); border-color: var(--brand-800); }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--ink-muted); }
  .btn-ghost:hover { background: var(--subtle); color: var(--ink-soft); }
  .btn-xs { padding: 2px 8px; font-size: 11.5px; border-radius: 5px; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px;
    border-radius: 999px; font-size: 11px; border: 1px solid var(--line);
    color: var(--ink-muted); background: var(--subtle); white-space: nowrap;
  }
  .badge-ok { background: var(--success-soft); color: var(--success-deep); border-color: transparent; }
  .badge-warn { background: var(--warning-soft); color: var(--warning-deep); border-color: transparent; }
  .badge-danger { background: var(--danger-soft); color: var(--danger-deep); border-color: transparent; }
  .badge-info { background: var(--info-soft); color: var(--info-deep); border-color: transparent; }
  .badge-ai { background: var(--ai-soft); color: var(--ai-deep); border-color: transparent; }
  .badge-brand { background: var(--brand-50); color: var(--brand-800); border-color: var(--brand-200); }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); }
  .input, .select {
    font: inherit; font-size: 12.5px; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; width: 100%;
    transition: border-color .15s ease;
  }
  .input:focus, .select:focus { border-color: var(--brand-600); outline: none; box-shadow: 0 0 0 3px rgba(234,88,12,.12); }
  .input::placeholder { color: var(--ink-faint); }
  code, pre, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .muted { color: var(--ink-muted); } .faint { color: var(--ink-faint); }
  .sep { height: 1px; background: var(--line-soft); margin: 10px 0; }

  /* ===== 应用框架 ===== */
  #app { height: 100%; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    background: var(--card); border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; cursor: pointer; }
  .logo-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--brand-800);
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .navpill { display: flex; gap: 3px; background: var(--subtle); border-radius: 9px; padding: 3px; }
  .navpill button {
    appearance: none; border: none; background: transparent; color: var(--ink-muted);
    font: inherit; font-size: 12.5px; padding: 4px 12px; border-radius: 7px; cursor: pointer;
    transition: all .15s ease;
  }
  .navpill button:hover { color: var(--ink); }
  .navpill button.active { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: var(--shadow-card); }
  .navpill button:disabled { opacity: .4; cursor: not-allowed; }
  .searchbox {
    display: flex; align-items: center; gap: 6px; flex: 1; max-width: 330px;
    border: 1px solid var(--line); border-radius: 7px; padding: 4px 10px; background: var(--card);
  }
  .searchbox input { all: unset; font: inherit; font-size: 12.5px; color: var(--ink); flex: 1; }
  .userchip { display: flex; align-items: center; gap: 8px; }
  .main { flex: 1; min-height: 0; display: flex; }

  /* ===== 画布 ===== */
  .canvas-screen { display: flex; flex-direction: column; height: 100%; flex: 1; min-width: 0; }
  .canvas-toolbar {
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 8px 14px;
    background: var(--card); border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .canvas-area { flex: 1; position: relative; overflow: hidden; background: var(--page); }
  .canvas-area::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(circle, rgba(148,163,184,.35) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  .canvas-inner { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  #edgeSvg { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }
  #edgeSvg .edge-hit { pointer-events: stroke; cursor: pointer; }
  #edgeSvg .edge-visible { pointer-events: none; }

  .side { width: 230px; border-right: 1px solid var(--line); background: var(--card); padding: 10px;
    overflow: auto; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; }
  .side h4 { margin: 0 0 6px; font-size: 11px; font-weight: 600; color: var(--ink-muted); letter-spacing: .3px; }
  .side-item { padding: 7px 8px; border-radius: 7px; cursor: pointer; border: 1px solid transparent; transition: all .15s ease; }
  .side-item:hover { background: var(--subtle); }
  .side-item.active { border-color: var(--line); background: var(--subtle); }
  .side-item .nm { font-size: 12.5px; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; }
  .side-item .nm b { font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-item .sub { font-size: 10.5px; color: var(--ink-faint); margin-top: 1px; }
  .side-item .count { margin-left: auto; font-size: 10.5px; color: var(--ink-faint); }
  .type-mark {
    width: 20px; height: 20px; border-radius: 6px; display: inline-flex; align-items: center;
    justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0;
  }
  .tm-source { background: #EFF6FF; color: #1E40AF; }
  .tm-application { background: #F0FDF4; color: #166534; }
  .tm-warehouse { background: #FFF7ED; color: #9A3412; }
  .tm-bi { background: #EEF2FF; color: #3730A3; }
  .tm-external { background: #FEF2F2; color: #B91C1C; }
  .tm-other { background: var(--subtle); color: var(--ink-muted); }

  .detail { width: 330px; border-left: 1px solid var(--line); background: var(--card); padding: 12px;
    overflow: auto; flex-shrink: 0; }
  .detail h3 { margin: 0 0 4px; font-size: 14px; }
  .detail .sub { font-size: 11px; color: var(--ink-faint); margin-bottom: 10px; }
  .kv { display: flex; gap: 8px; font-size: 12px; margin: 3px 0; }
  .kv .k { width: 70px; color: var(--ink-faint); flex-shrink: 0; }
  .kv .v { color: var(--ink-soft); min-width: 0; }
  .sec-t { font-size: 11px; font-weight: 600; color: var(--ink-muted); margin: 14px 0 6px;
    display: flex; align-items: center; justify-content: space-between; }
  .anno { border-left: 2px solid var(--brand-200); padding: 2px 0 2px 9px; margin: 7px 0; font-size: 12px; color: var(--ink-soft); }
  .anno .meta { font-size: 10.5px; color: var(--ink-faint); margin-top: 2px; }
  .codelist { background: var(--subtle); border-radius: 7px; padding: 8px 10px; font-size: 10.5px;
    color: var(--ink-soft); white-space: pre-wrap; word-break: break-all; line-height: 1.55; }
  .updown { display: flex; flex-direction: column; gap: 3px; }
  .updown a { font-size: 12px; color: var(--brand-700); cursor: pointer; text-decoration: none; }
  .updown a:hover { text-decoration: underline; }
  .updown .hop { color: var(--ink-faint); font-size: 10.5px; }
  .evi { border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; margin: 6px 0;
    font-size: 11.5px; color: var(--ink-soft); cursor: pointer; transition: all .15s ease; background: var(--card); }
  .evi:hover { border-color: var(--brand-300); background: var(--brand-50); }
  .evi .f { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--ink); word-break: break-all; }
  .evi .m { color: var(--ink-faint); font-size: 10.5px; margin-top: 2px; }

  /* ===== 系统节点 ===== */
  .sys-node {
    position: absolute; width: 220px; background: var(--card);
    border: 1px solid var(--line-strong); border-radius: 12px;
    box-shadow: var(--shadow-node); cursor: pointer; user-select: none;
    transition: box-shadow .18s ease, border-color .18s ease, transform .18s ease;
  }
  .sys-node:hover { box-shadow: 0 4px 14px rgba(15,23,42,.12); transform: translateY(-1px); }
  .sys-node.selected { border-color: var(--brand-600); box-shadow: 0 0 0 1.5px var(--brand-600), 0 4px 16px rgba(234,88,12,.16); }
  .sys-node.seed { border-color: var(--brand-300); }
  .sys-node.dimmed { opacity: .35; }
  .sys-stripe { height: 3px; border-radius: 12px 12px 0 0; }
  .sys-body { padding: 10px 12px 11px; }
  .sys-head { display: flex; align-items: center; gap: 8px; }
  .sys-name { font-weight: 600; font-size: 13px; color: var(--ink); flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sys-id { font-size: 10px; color: var(--ink-faint); font-family: ui-monospace, Menlo, monospace; margin-top: 1px; }
  .sys-meta { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .sys-desc { font-size: 10.5px; color: var(--ink-faint); margin-top: 6px; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .hop-badge { position: absolute; top: -9px; right: 8px; font-size: 9.5px; padding: 1px 6px; border-radius: 999px;
    background: var(--brand-700); color: #fff; border: 2px solid var(--card); }
  .cycle-badge { position: absolute; top: -9px; left: 8px; font-size: 9.5px; padding: 1px 6px; border-radius: 999px;
    background: var(--warning-soft); color: var(--warning-deep); border: 1px solid var(--warning); }

  /* ===== 数据集/字段节点 ===== */
  .ds-node {
    position: absolute; width: 200px; background: var(--card);
    border: 1px solid var(--line-strong); border-radius: 10px;
    box-shadow: var(--shadow-node); cursor: pointer; user-select: none;
    transition: box-shadow .18s ease, border-color .18s ease;
  }
  .ds-node:hover { box-shadow: 0 4px 14px rgba(15,23,42,.12); }
  .ds-node.selected { border-color: var(--brand-600); box-shadow: 0 0 0 1.5px var(--brand-600), 0 4px 16px rgba(234,88,12,.16); }
  .ds-node.dimmed { opacity: .35; }
  .ds-head { display: flex; align-items: center; gap: 7px; padding: 8px 9px; border-bottom: 1px solid var(--line-soft); }
  .ds-name { font-weight: 600; font-size: 12px; color: var(--ink); flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ds-id { font-size: 9.5px; color: var(--ink-faint); font-family: ui-monospace, Menlo, monospace; }
  .ds-sys { font-size: 9.5px; color: var(--ink-faint); padding: 0 5px; border-radius: 4px; background: var(--subtle); }
  .field-row { display: flex; align-items: center; gap: 6px; padding: 0 9px; height: 24px;
    border-bottom: 1px solid var(--line-soft); cursor: pointer; position: relative; transition: background .15s ease; }
  .field-row:last-child { border-bottom: none; }
  .field-row:hover { background: var(--subtle); }
  .field-row.selected { background: var(--brand-50); }
  .field-row.in-chain { background: var(--brand-50); }
  .fname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 11.5px; color: var(--ink-soft); }
  .ftype { font-size: 9.5px; color: var(--ink-faint); font-family: ui-monospace, Menlo, monospace; }
  .f-dot { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid var(--line-strong); flex-shrink: 0; }
  .field-row.selected .f-dot, .field-row.in-chain .f-dot { border-color: var(--brand-600); background: var(--brand-100); }

  /* ===== 图例 / 缩放 / 边抽屉 ===== */
  .legend { position: absolute; left: 12px; bottom: 12px; background: rgba(255,255,255,.94);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 11px;
    color: var(--ink-muted); display: flex; flex-direction: column; gap: 4px; pointer-events: none; z-index: 3; }
  .legend .lg-row { display: flex; align-items: center; gap: 7px; }
  .lg-line { width: 26px; height: 0; border-top: 2px solid; flex-shrink: 0; }
  .zoomctl { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 4px; z-index: 3; }
  .zoomctl button { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--card); font-size: 14px; cursor: pointer; color: var(--ink-soft); }
  .zoomctl button:hover { background: var(--subtle); }

  .edge-drawer { position: absolute; left: 12px; right: 54px; bottom: 12px; max-height: 190px;
    background: rgba(255,255,255,.97); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow-pop); overflow: hidden; z-index: 4; display: flex; flex-direction: column; }
  .edge-drawer-head { display: flex; align-items: center; gap: 8px; padding: 7px 10px;
    border-bottom: 1px solid var(--line-soft); font-size: 11.5px; color: var(--ink-muted); }
  .edge-drawer-head b { color: var(--ink); font-size: 12px; }
  .edge-drawer-body { overflow: auto; }
  .edge-row { display: grid; grid-template-columns: 70px 1fr 78px 56px; gap: 8px; align-items: center;
    padding: 5px 10px; border-bottom: 1px solid var(--line-soft); font-size: 11.5px; cursor: pointer; }
  .edge-row:hover { background: var(--subtle); }
  .edge-row.active { background: var(--brand-50); }
  .edge-row .route { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--ink-soft);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .origin-explicit { color: var(--success-deep); background: var(--success-soft); }
  .origin-derived { color: var(--ink-muted); background: var(--subtle); }
  .origin-both { color: var(--info-deep); background: var(--info-soft); }
  .origin-ai { color: var(--ai-deep); background: var(--ai-soft); }

  /* ===== 弹层 ===== */
  .overlay { position: fixed; inset: 0; background: rgba(15,23,42,.42); display: flex;
    align-items: center; justify-content: center; z-index: 60; padding: 24px; }
  .modal { background: var(--card); border-radius: 14px; box-shadow: var(--shadow-pop);
    width: min(960px, 94vw); max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
  .modal-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .modal-head h3 { margin: 0; font-size: 14px; flex: 1; }
  .modal-body { padding: 14px 16px; overflow: auto; }
  .modal-foot { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
  .arch-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .arch-box { border: 1px solid var(--line); border-radius: 12px; background: var(--card); padding: 12px 14px; }
  .arch-box h4 { margin: 0 0 8px; font-size: 12.5px; display: flex; align-items: center; gap: 7px; }
  .arch-box ul { margin: 0; padding-left: 16px; font-size: 11.5px; color: var(--ink-soft); }
  .arch-box li { margin: 3px 0; }
  .arch-tag { font-size: 10px; padding: 1px 7px; border-radius: 999px; }
  .flowrow { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--ink-muted); margin: 12px 0; flex-wrap: wrap; }
  .flowrow b { color: var(--ink-soft); }
  .principle { flex: 1; border-radius: 12px; padding: 12px 14px; font-size: 12.5px; }
  .principle .pt { font-weight: 700; margin-bottom: 5px; display: flex; gap: 7px; align-items: center; }
  .principle .pn { width: 20px; height: 20px; border-radius: 6px; color: #fff; display: inline-flex;
    align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; }

  .toast-wrap { position: fixed; top: 14px; right: 14px; z-index: 90; display: flex; flex-direction: column; gap: 8px; }
  .toast { background: var(--ink); color: #fff; border-radius: 9px; padding: 9px 14px; font-size: 12.5px;
    box-shadow: var(--shadow-pop); display: flex; gap: 8px; align-items: center; animation: slidein .25s ease; }
  .toast.ok::before { content: "✓"; color: #6EE7A8; font-weight: 700; }
  .toast.warn::before { content: "!"; color: #FCD34D; font-weight: 700; }
  @keyframes slidein { from { transform: translateX(20px); opacity: 0; } }

  .yarn { stroke: var(--brand-300); stroke-width: 2.2; fill: none; stroke-linecap: round; }
  .yarn2 { stroke: #fff; stroke-width: 2.2; fill: none; stroke-linecap: round; opacity: .9; }
  @media (max-width: 1100px) { .side, .detail { display: none; } .arch-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-wrap" id="toasts"></div>

<script>
"use strict";
/* ============================================================
   Clew 系统级血缘原型 · mock 数据（电商订单主题）
   目标：验证「系统 / 数据集 / 字段」三级视图与系统边证据下钻
   存储分层：SQLite 管实体属性与入口检索；Kùzu 管关系实例与链路遍历
   ============================================================ */

const TYPE_META = {
  source:      { label: "源系统", mark: "源", cls: "tm-source",      color: "#2563EB", stripe: "#BFDBFE" },
  application: { label: "业务应用", mark: "应", cls: "tm-application", color: "#15803D", stripe: "#BBF7D0" },
  warehouse:   { label: "数仓/湖", mark: "仓", cls: "tm-warehouse",   color: "#EA580C", stripe: "#FED7AA" },
  bi:          { label: "分析/BI", mark: "BI", cls: "tm-bi",          color: "#4F46E5", stripe: "#C7D2FE" },
  external:    { label: "外部系统", mark: "外", cls: "tm-external",    color: "#DC2626", stripe: "#FECACA" },
  other:       { label: "其他", mark: "他", cls: "tm-other",          color: "#64748B", stripe: "#E2E8F0" },
};
const SRC_LABEL = { imported: "导入", manual: "人工", ai: "AI 建议", derived: "投影" };
const ORIGIN_LABEL = { explicit: "显式", derived: "投影", both: "显式+投影" };

/* ---- 系统目录（SQLite system 表） ---- */
const SYSTEMS = [

/* ============================================================
   派生：系统边 = 显式边 ∪ 数据集边投影
   ============================================================ */
function buildSystemEdges(includeCycle) {
  const map = new Map();
  DATASET_EDGES.forEach(e => {
    const fs = DATASET_MAP[e.from] && DATASET_MAP[e.from].systemId;
    const ts = DATASET_MAP[e.to] && DATASET_MAP[e.to].systemId;
    if (!fs || !ts || fs === ts) return;
    const key = fs + "->" + ts;
    if (!map.has(key)) {
      map.set(key, { from: fs, to: ts, origin: "derived", source: "derived", confidence: 1, evidence: [] });
    }
    const se = map.get(key);
    se.evidence.push(e);
    se.confidence = Math.min(se.confidence, e.confidence);
  });
  const explicit = EXPLICIT_SYSTEM_EDGES.concat(includeCycle ? [CYCLE_EDGE] : []);
  explicit.forEach(x => {
    const key = x.from + "->" + x.to;
    const existing = map.get(key);
    if (existing) {
      map.set(key, Object.assign({}, existing, x, { origin: "both", evidence: existing.evidence }));
    } else {
      map.set(key, Object.assign({}, x, { origin: "explicit", evidence: [] }));
    }
  });
  return Array.from(map.values()).map(e => {
    const pairs = new Set(e.evidence.map(x => x.from + "->" + x.to));
    return Object.assign({}, e, {
      datasetEdgeCount: pairs.size,
      evidence: e.evidence.slice().sort((a, b) => a.id - b.id),
    });
  }).sort((a, b) => a.from.localeCompare(b.from) || a.to.localeCompare(b.to));
}

/* ---- 系统图可见性：过滤 + 闭包 + 方向 ---- */
function visibleSystemEdges() {
  return S.systemEdges.filter(e => {
    const f = S.filters;
    if (e.origin === "explicit" && !f.explicit) return false;
    if (e.origin === "derived" && !f.derived) return false;
    if (e.origin === "both" && !f.explicit && !f.derived) return false;
    if (e.source === "ai" && !f.ai) return false;
    return true;
  });
}
function systemClosure() {
  const edges = visibleSystemEdges();
  const adj = {};
  const add = (a, b) => { (adj[a] = adj[a] || []).push(b); };
  edges.forEach(e => {
    if (S.direction !== "down") add(e.to, e.from);  // 反向：找上游
    if (S.direction !== "up") add(e.from, e.to);    // 正向：找下游
  });
  const hop = new Map([[S.seed, 0]]);
  const queue = [S.seed];
  while (queue.length) {
    const cur = queue.shift();
    const h = hop.get(cur);
    if (h >= S.hops) continue;
    (adj[cur] || []).forEach(nxt => {
      if (!hop.has(nxt)) { hop.set(nxt, h + 1); queue.push(nxt); }
    });
  }
  return hop;
}
function closureEdges(hop) {
  return visibleSystemEdges().filter(e => {
    if (!hop.has(e.from) || !hop.has(e.to)) return false;
    if (S.direction === "up") return hop.get(e.from) > hop.get(e.to);
    if (S.direction === "down") return hop.get(e.from) < hop.get(e.to);
    return true;
  });
}

/* ---- 简单环检测（用于演示系统级聚合环） ---- */
function systemsInCycle() {
  const ids = new Set();
  const adj = {};
  S.systemEdges.forEach(e => { (adj[e.from] = adj[e.from] || []).push(e.to); });
  const visiting = new Set(), visited = new Set(), stack = [];
  function dfs(n) {
    if (visiting.has(n)) {
      const i = stack.indexOf(n);
      stack.slice(i).forEach(x => ids.add(x));
      return;
    }
    if (visited.has(n)) return;
    visiting.add(n); stack.push(n);
    (adj[n] || []).forEach(dfs);
    stack.pop(); visiting.delete(n); visited.add(n);
  }
  Object.keys(adj).forEach(dfs);
  return ids;
}

/* ---- 数据集视图可见性 ---- */
function visibleDatasets() {
  const hop = systemClosure();
  return DATASETS.filter(d => {
    if (S.showAllDatasets) return true;
    if (!d.systemId) return false;
    return hop.has(d.systemId);
  });
}
function visibleDatasetEdges() {
  const ids = new Set(visibleDatasets().map(d => d.id));
  return DATASET_EDGES.filter(e => ids.has(e.from) && ids.has(e.to));
}

  edges.forEach(e => { ids.add(e.from); ids.add(e.to); });
  const nodes = Array.from(ids).map(id => ds(id)).filter(Boolean);
  return { focus, nodes, edges };
}
function involvedFields(datasetId, edges, focus) {
  const names = new Set();
  edges.forEach(e => {
    if (e.from === datasetId) names.add(e.fromField);
    if (e.to === datasetId) names.add(e.toField);
  });
  if (datasetId === focus) return ds(datasetId).fields.map(f => f.name);
  return Array.from(names);
}

/* ============================================================
   画布：系统视图
   ============================================================ */
const SYS_W = 220, SYS_H = 96;
function drawCanvas() {
  const layer = document.getElementById("nodeLayer");
  const svg = document.getElementById("edgeSvg");
  if (!layer || !svg) return;
  if (S.level === "system") drawSystemGraph(layer, svg);
  else if (S.level === "dataset") drawDatasetGraph(layer, svg);
  else drawFieldGraph(layer, svg);
  applyView();
}

function edgeStyle(e, selected) {
  const ai = e.source === "ai";
  const derived = e.origin === "derived";
  let color = ai ? "#4F46E5" : derived ? "#94A3B8" : "#0D9488";
  let dash = ai ? "6 5" : derived ? "5 5" : "";
  if (selected) { color = "#EA580C"; dash = "7 4"; }
  return { color, dash, width: selected ? 2.8 : (ai ? 1.9 : 1.7) };
}

function drawSystemGraph(layer, svg) {
  const hop = systemClosure();
  const edges = closureEdges(hop);
  const cycleIds = systemsInCycle();
  const cycleEdgeKeys = new Set();
  if (S.demoCycle) cycleEdgeKeys.add(edgeKey(CYCLE_EDGE));

  layer.innerHTML = SYSTEMS.map(s => {
    if (!hop.has(s.id)) return "";
    const t = typeMeta(s.type);
    const selected = S.selectedSystem === s.id;
    const isSeed = S.seed === s.id;
    const count = DATASETS.filter(d => d.systemId === s.id).length;
    return '<div class="sys-node ' + (selected ? "selected" : "") + (isSeed ? " seed" : "") + '" style="left:' + s.x + 'px;top:' + s.y + 'px" ' +
      'onclick="delayedSelectSystem(\'' + s.id + '\')" ondblclick="drillSystemNow(\'' + s.id + '\')" title="单击查看详情，双击下钻数据集">' +
      '<div class="sys-stripe" style="background:' + t.stripe + '"></div>' +
      (isSeed ? '<span class="hop-badge">种子</span>' : '<span class="hop-badge" style="background:var(--ink-muted)">hop ' + hop.get(s.id) + '</span>') +
      (cycleIds.has(s.id) ? '<span class="cycle-badge">环</span>' : "") +
      '<div class="sys-body">' +
        '<div class="sys-head"><span class="type-mark ' + t.cls + '">' + t.mark + '</span>' +
          '<div style="min-width:0;flex:1"><div class="sys-name">' + esc(s.name) + '</div><div class="sys-id">' + s.id + '</div></div></div>' +
        '<div class="sys-meta"><span class="badge" style="font-size:9.5px">' + t.label + '</span>' +
          '<span class="badge" style="font-size:9.5px">' + count + ' 数据集</span>' +
          (s.owner ? '<span class="badge" style="font-size:9.5px">' + esc(s.owner) + '</span>' : "") + '</div>' +
        '<div class="sys-desc">' + esc(s.desc) + '</div>' +
      '</div></div>';
  }).join("");

  const markers = ["#4F46E5", "#94A3B8", "#0D9488", "#EA580C", "#475569"].map(c =>
    '<marker id="ah' + c.slice(1) + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
    '<path d="M 0 0 L 10 5 L 0 10 z" fill="' + c + '"/></marker>').join("");
  let paths = edges.map(e => {
    const a = sys(e.from), b = sys(e.to);
    if (!a || !b) return "";
    const forward = a.x <= b.x;
    const x1 = forward ? a.x + SYS_W : a.x;
    const x2 = forward ? b.x : b.x + SYS_W;
    const y1 = a.y + SYS_H / 2, y2 = b.y + SYS_H / 2;
    const selected = S.selectedEdge === edgeKey(e);
    const st = edgeStyle(e, selected);
    const d = curvePath(x1, y1, x2, y2);
    const midX = (x1 + x2) / 2, midY = (y1 + y2) / 2 - 8;
    const label = e.source === "ai" ? "AI" : e.datasetEdgeCount > 0 ? "×" + e.datasetEdgeCount : "显式";
    const lw = label.length > 2 ? 42 : 30;
    const isCycle = cycleEdgeKeys.has(edgeKey(e)) || (cycleIds.has(e.from) && cycleIds.has(e.to));
    return '<g>' +
      '<path class="edge-hit" d="' + d + '" fill="none" stroke="transparent" stroke-width="16" onclick="selectEdge(\'' + edgeKey(e) + '\')"><title>' + esc(edgeTitle(e)) + '</title></path>' +
      '<path class="edge-visible" d="' + d + '" fill="none" stroke="' + st.color + '" stroke-width="' + st.width + '"' +
        (st.dash ? ' stroke-dasharray="' + st.dash + '"' : "") +
        ' marker-end="url(#ah' + st.color.slice(1) + ')" opacity="' + (selected ? "1" : "0.9") + '"></path>' +
      '<rect x="' + (midX - lw / 2) + '" y="' + (midY - 9) + '" width="' + lw + '" height="16" rx="8" fill="#fff" stroke="' + st.color + '" stroke-opacity=".35"></rect>' +
      '<text x="' + midX + '" y="' + (midY + 2) + '" text-anchor="middle" font-size="9" fill="' + st.color + '">' + esc(label) + '</text>' +
      (isCycle ? '<text x="' + (midX + lw / 2 + 6) + '" y="' + (midY + 2) + '" font-size="9" fill="#B45309">环</text>' : "") +
    '</g>';
  }).join("");
  const W = 1500, H = 760;
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.innerHTML = "<defs>" + markers + "</defs>" + paths;
  // 画布容器尺寸
  const inner = document.getElementById("canvasInner");
  if (inner) { inner.style.width = W + "px"; inner.style.height = H + "px"; }
}
function curvePath(x1, y1, x2, y2) {
  const dx = Math.max(42, Math.abs(x2 - x1) * 0.45);
  const sign = x2 >= x1 ? 1 : -1;
  return "M " + x1 + " " + y1 + " C " + (x1 + dx * sign) + " " + y1 + ", " + (x2 - dx * sign) + " " + y2 + ", " + x2 + " " + y2;
}
function edgeTitle(e) {
  const parts = [e.from + " → " + e.to, "来源: " + (e.source === "ai" ? "AI 候选" : ORIGIN_LABEL[e.origin])];
  if (e.datasetEdgeCount) parts.push("数据集级证据: " + e.datasetEdgeCount + " 条");
  if (e.transform) parts.push("接口: " + e.transform);
  if (e.note) parts.push("备注: " + e.note);
  parts.push("置信度: " + e.confidence.toFixed(2));
  return parts.join("\n");
}

const DS_W = 200;
function dsHeight(d, expanded) {
  if (!expanded) return 64;

}

  layer.innerHTML = datasets.map(d => {
    const s = d.systemId ? sys(d.systemId) : null;
    const t = s ? typeMeta(s.type) : typeMeta("other");
    const isExpanded = !!expanded[d.id];
    const selected = S.selectedDataset === d.id;
    const rows = isExpanded ? d.fields.map(f =>
      '<div class="field-row ' + (S.selectedField && S.selectedField.ds === d.id && S.selectedField.f === f.name ? "selected" : "") +
      '" onclick="event.stopPropagation();selectField(\'' + d.id + '\',\'' + f.name + '\')">' +
      '<span class="f-dot"></span><span class="fname">' + esc(f.name) + '</span><span class="ftype">' + esc(f.type) + '</span></div>'
    ).join("") : "";
    return '<div class="ds-node ' + (selected ? "selected" : "") + '" style="left:' + d.x + 'px;top:' + d.y + 'px" ' +
      'onclick="delayedSelectDataset(\'' + d.id + '\')" ondblclick="drillDatasetNow(\'' + d.id + '\')" title="单击查看详情，双击进入字段视图">' +
      '<div class="ds-head" style="border-left:3px solid ' + t.color + '">' +
        '<div style="min-width:0;flex:1"><div class="ds-name">' + esc(d.name) + '</div><div class="ds-id">' + d.id + '</div></div>' +
        '<span class="ds-sys">' + (s ? esc(s.name) : "未归属") + '</span>' +
      '</div>' + rows +
      (isExpanded ? "" : '<div class="faint" style="padding:5px 9px;font-size:10px;border-top:1px solid var(--line-soft)">' + d.fields.length + ' 字段 · 双击看字段视图</div>') +
    '</div>';
  }).join("");
  const markers = ["#475569", "#0D9488", "#4F46E5", "#94A3B8", "#EA580C"].map(c =>
    '<marker id="dah' + c.slice(1) + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
    '<path d="M 0 0 L 10 5 L 0 10 z" fill="' + c + '"/></marker>').join("");
  const paths = edges.map(e => {
    const a = ds(e.from), b = ds(e.to);
    if (!a || !b || !ids.has(a.id) || !ids.has(b.id)) return "";
    const ah = dsHeight(a, expanded[a.id]), bh = dsHeight(b, expanded[b.id]);
    const forward = a.x <= b.x;
    const x1 = forward ? a.x + DS_W : a.x;
    const x2 = forward ? b.x : b.x + DS_W;
    const y1 = a.y + ah / 2, y2 = b.y + bh / 2;
    const selected = S.selectedEdge === "ds:" + e.id;
    const color = selected ? "#EA580C" : e.source === "ai" ? "#4F46E5" : e.source === "manual" ? "#0D9488" : "#94A3B8";
    const dash = selected ? "7 4" : e.source === "ai" ? "6 5" : e.source === "manual" ? "" : "4 5";
    const d = curvePath(x1, y1, x2, y2);
    return '<g>' +
      '<path class="edge-hit" d="' + d + '" fill="none" stroke="transparent" stroke-width="14" onclick="selectDatasetEdge(' + e.id + ')"><title>' + esc(e.from + "." + e.fromField + " → " + e.to + "." + e.toField) + '</title></path>' +
      '<path class="edge-visible" d="' + d + '" fill="none" stroke="' + color + '" stroke-width="' + (selected ? 2.6 : 1.5) + '"' +
        (dash ? ' stroke-dasharray="' + dash + '"' : "") + ' marker-end="url(#dah' + color.slice(1) + ')" opacity=".88"></path>' +
    '</g>';
  }).join("");
  const W = 1560, H = 820;
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.innerHTML = "<defs>" + markers + "</defs>" + paths;
  const inner = document.getElementById("canvasInner");
  if (inner) { inner.style.width = W + "px"; inner.style.height = H + "px"; }
}

/* ============================================================
   画布：字段视图
   ============================================================ */
const FW = 240, FROW = 26, FHEAD = 40;
function drawFieldGraph(layer, svg) {
  const { focus, nodes, edges } = fieldViewData();
  const upstream = new Set(), downstream = new Set();
  edges.forEach(e => {
    if (e.to === focus) upstream.add(e.from);
    if (e.from === focus) downstream.add(e.to);
  });
  const positions = {};
  let uy = 40, dy = 40, fy = 40;
  nodes.forEach(n => {
    if (n.id === focus) { positions[n.id] = { x: 380, y: fy, fields: n.fields.map(f => f.name) }; return; }
    if (upstream.has(n.id) && downstream.has(n.id)) { positions[n.id] = { x: 700, y: dy, fields: involvedFields(n.id, edges, focus) }; dy += 180; return; }
    if (upstream.has(n.id)) { positions[n.id] = { x: 40, y: uy, fields: involvedFields(n.id, edges, focus) }; uy += 180; return; }
    if (downstream.has(n.id)) { positions[n.id] = { x: 720, y: dy, fields: involvedFields(n.id, edges, focus) }; dy += 180; return; }
    positions[n.id] = { x: 40, y: uy, fields: involvedFields(n.id, edges, focus) }; uy += 180;
  });
  const nodeH = id => FHEAD + positions[id].fields.length * FROW + 8;
  layer.innerHTML = nodes.map(n => {
    const p = positions[n.id];
    const s = n.systemId ? sys(n.systemId) : null;
    const t = s ? typeMeta(s.type) : typeMeta("other");
    const rows = p.fields.map(fname => {
      const f = n.fields.find(x => x.name === fname);
      if (!f) return "";
      const selected = S.selectedField && S.selectedField.ds === n.id && S.selectedField.f === fname;
      return '<div class="field-row ' + (selected ? "selected" : "") + '" onclick="selectField(\'' + n.id + '\',\'' + fname + '\')">' +
        '<span class="f-dot"></span><span class="fname">' + esc(fname) + '</span><span class="ftype">' + esc(f.type) + '</span></div>';
    }).join("");
    return '<div class="ds-node ' + (n.id === focus ? "selected" : "") + '" style="left:' + p.x + 'px;top:' + p.y + 'px;width:' + FW + 'px" ' +
      'onclick="selectDataset(\'' + n.id + '\')">' +
      '<div class="ds-head" style="border-left:3px solid ' + t.color + '">' +
        '<div style="min-width:0;flex:1"><div class="ds-name">' + esc(n.name) + '</div><div class="ds-id">' + n.id + '</div></div>' +
        '<span class="ds-sys">' + (s ? esc(s.name) : "未归属") + '</span>' +
      '</div>' + rows + '</div>';
  }).join("");
  const markers = ["#475569", "#0D9488", "#4F46E5", "#EA580C"].map(c =>
    '<marker id="fah' + c.slice(1) + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
    '<path d="M 0 0 L 10 5 L 0 10 z" fill="' + c + '"/></marker>').join("");
  const rowY = (nid, fname) => {
    const p = positions[nid];
    const idx = p.fields.indexOf(fname);
    return p.y + FHEAD + idx * FROW + FROW / 2;
  };
  const paths = edges.filter(e => positions[e.from] && positions[e.to]).map(e => {
    const a = positions[e.from], b = positions[e.to];
    const forward = a.x <= b.x;
    const x1 = forward ? a.x + FW : a.x;
    const x2 = forward ? b.x : b.x + FW;
    const y1 = rowY(e.from, e.fromField);
    const y2 = rowY(e.to, e.toField);
    const selected = S.selectedEdge === "ds:" + e.id;
    const color = selected ? "#EA580C" : e.source === "ai" ? "#4F46E5" : e.source === "manual" ? "#0D9488" : "#94A3B8";
    const dash = selected ? "7 4" : e.source === "ai" ? "6 5" : e.source === "manual" ? "" : "4 5";
    const d = curvePath(x1, y1, x2, y2);
    return '<g>' +
      '<path class="edge-hit" d="' + d + '" fill="none" stroke="transparent" stroke-width="14" onclick="selectDatasetEdge(' + e.id + ')"><title>' + esc(e.from + "." + e.fromField + " → " + e.to + "." + e.toField + "\n" + e.transform) + '</title></path>' +
      '<path class="edge-visible" d="' + d + '" fill="none" stroke="' + color + '" stroke-width="' + (selected ? 2.6 : 1.5) + '"' +
        (dash ? ' stroke-dasharray="' + dash + '"' : "") + ' marker-end="url(#fah' + color.slice(1) + ')" opacity=".9"></path>' +
    '</g>';
  }).join("");
  const W = 1120, H = 620;
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.innerHTML = "<defs>" + markers + "</defs>" + paths;
  const inner = document.getElementById("canvasInner");
  if (inner) { inner.style.width = W + "px"; inner.style.height = H + "px"; }
}

/* ============================================================

function detailHtml() {
  if (S.selectedEdge && S.selectedEdge.indexOf("->") >= 0 && S.level === "system") {
    const e = S.systemEdges.find(x => edgeKey(x) === S.selectedEdge);
    if (e) return systemEdgeDetail(e);
  }
  if (S.selectedEdge && S.selectedEdge.indexOf("ds:") === 0) {
    const id = +S.selectedEdge.slice(3);
    const e = DATASET_EDGES.find(x => x.id === id);
    if (e) return datasetEdgeDetail(e);
  }
  if (S.level === "system") {
    const s = sys(S.selectedSystem) || sys(S.seed);
    return systemDetail(s);
  }
  if (S.level === "dataset") {
    const d = ds(S.selectedDataset) || visibleDatasets()[0];
    return d ? datasetDetail(d) : "<h3>数据集</h3><div class='faint'>当前闭包内没有数据集。</div>";
  }
  const d = ds(S.selectedDataset);
  return d ? fieldDetail(d, S.selectedField) : "<h3>字段</h3><div class='faint'>请选择一个字段。</div>";
}

    '<div style="display:flex;gap:6px">' +
      '<button class="btn btn-primary" style="flex:1;justify-content:center" onclick="drillSystem(\'' + s.id + '\')">下钻数据集视图</button>' +

    '</div>' +

    (annos.length ? '<div class="sec-t">系统注释</div>' + annos.map(a => '<div class="anno">' + esc(a.body) + '<div class="meta">' + esc(a.author) + ' · ' + esc(a.at) + '</div></div>').join("") : "") +

}
function setHops(v) { S.hops = +v; render(); toast("重新取系统子图：*1.." + S.hops); }
function setDirection(v) { S.direction = v; render(); }
function toggleFilter(k, v) { S.filters[k] = v; render(); }
function toggleAllDatasets(v) { S.showAllDatasets = v; S.needsFit = true; render(); }
function toggleEdgeDrawer() { S.showEdgeDrawer = !S.showEdgeDrawer; render(); }
function selectSystem(id) {
  S.selectedSystem = id;
  S.selectedEdge = null;
  render();
}
function drillSystem(id) {
  S.selectedSystem = id;
  S.seed = id;
  S.selectedEdge = null;
  S.selectedDataset = (DATASETS.find(d => d.systemId === id) || {}).id || S.selectedDataset;
  S.level = "dataset";
  S.needsFit = true;
  render();
  toast("下钻：数据集视图 · " + id);
}
function selectDataset(id) {
  S.selectedDataset = id;
  S.selectedEdge = null;
  if (!S.selectedField || S.selectedField.ds !== id) {
    const d = ds(id);
    S.selectedField = d && d.fields.length ? { ds: id, f: d.fields[0].name } : null;
  }
  if (S.level === "dataset") S.needsFit = true;
  render();
}
function drillDataset(id) {
  S.selectedDataset = id;
  S.level = "field";
  S.selectedEdge = null;
  const d = ds(id);
  if (d && d.fields.length) S.selectedField = { ds: id, f: d.fields[0].name };
  S.needsFit = true;
  render();
  toast("下钻：字段视图 · " + id);
}
function selectField(dsid, fname) {
  S.selectedDataset = dsid;
  S.selectedField = { ds: dsid, f: fname };
  S.selectedEdge = null;
  if (S.level === "system") S.level = "dataset";
  render();
}
function selectEdge(key) {
  S.selectedEdge = key;
  const e = S.systemEdges.find(x => edgeKey(x) === key);
  if (e) S.selectedSystem = e.from;
  render();
}
function selectDatasetEdge(id) {
  S.selectedEdge = "ds:" + id;
  const e = DATASET_EDGES.find(x => x.id === id);
  if (e) S.selectedDataset = e.from;
  render();
}
function jumpEvidence(id) {
  const e = DATASET_EDGES.find(x => x.id === id);
  if (!e) return;
  S.selectedDataset = e.from;
  S.selectedField = { ds: e.from, f: e.fromField };
  S.selectedEdge = "ds:" + id;
  S.level = "field";
  render();
  toast("已定位到底层字段证据 #" + id);
}
function showUnassigned() {
  const list = DATASETS.filter(d => !d.systemId);
  S.level = "dataset";
  S.showAllDatasets = true;
  S.selectedDataset = list.length ? list[0].id : S.selectedDataset;
  S.needsFit = true;
  render();
  toast("已显示全部数据集；未归属项不进入系统图", "warn");
}
function cycleGraphState() {
  S.graphState = S.graphState === "clean" ? "dirty" : S.graphState === "dirty" ? "cte" : "clean";
  render();
  const msg = S.graphState === "clean" ? "Kùzu 图已重建（COPY FROM，幂等）" : S.graphState === "dirty" ? "图已标脏；下次读请求自动重建" : "Kùzu 不可用：已降级 SQLite v_system_edge 递归 CTE";
  toast(msg, S.graphState === "clean" ? "ok" : "warn");
}
function toggleCycleDemo() {
  S.demoCycle = !S.demoCycle;
  S.systemEdges = buildSystemEdges(S.demoCycle);
  render();
  toast(S.demoCycle ? "已注入系统级聚合环（BI → 数仓）；注意：数据集级没有反向血缘" : "已移除演示环", S.demoCycle ? "warn" : "ok");
}
function zoomBy(k) { S.zoom = Math.min(2, Math.max(0.4, S.zoom * k)); applyView(); }
function focusCanvas(level) {
  const area = document.getElementById("canvasArea");
  if (!area) return;
  const aw = area.clientWidth || 900;
  const ah = area.clientHeight || 700;
  if (level === "system") {
    const xs = SYSTEMS.map(s => s.x), ys = SYSTEMS.map(s => s.y);
    const minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs) + SYS_W;
    const minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys) + SYS_H;
    const pad = 22;
    const z = Math.max(0.52, Math.min(0.95, (aw - pad * 2) / (maxX - minX), (ah - pad * 2) / (maxY - minY)));
    S.zoom = z;
    S.panX = Math.round(pad - minX * z);
    S.panY = Math.round(pad - minY * z);
  } else if (level === "dataset") {
    const d = ds(S.selectedDataset) || visibleDatasets()[0] || DATASETS[0];
    S.zoom = 0.72;
    S.panX = Math.round(aw / 2 - (d.x + DS_W / 2) * S.zoom);
    S.panY = Math.round(ah / 2 - (d.y + 60) * S.zoom);
  } else {
    S.zoom = 0.9;
    S.panX = Math.round(aw / 2 - (380 + FW / 2) * S.zoom);
    S.panY = Math.round(ah / 2 - 150 * S.zoom);
  }
  applyView();
}
function resetView() { S.needsFit = false; focusCanvas(S.level); }
function applyView() {
  const el = document.getElementById("canvasInner");
  if (el) el.style.transform = "translate(" + S.panX + "px," + S.panY + "px) scale(" + S.zoom + ")";
}
let panning = null;
function panStart(ev) {
  if (ev.target.closest(".sys-node") || ev.target.closest(".ds-node") || ev.target.closest(".zoomctl") || ev.target.closest(".edge-drawer")) return;
  panning = { x: ev.clientX, y: ev.clientY, px: S.panX, py: S.panY };
  const move = e2 => {
    if (!panning) return;
    S.panX = panning.px + (e2.clientX - panning.x);
    S.panY = panning.py + (e2.clientY - panning.y);
    applyView();
  };
  const up = () => { panning = null; window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); };
  window.addEventListener("mousemove", move); window.addEventListener("mouseup", up);
}
document.addEventListener("wheel", ev => {
  const area = ev.target.closest && ev.target.closest(".canvas-area");
  if (!area) return;
  ev.preventDefault();
  zoomBy(ev.deltaY < 0 ? 1.08 : 0.92);
}, { passive: false });

/* ============================================================
   架构说明弹层
   ============================================================ */
function openArch() {
  const html =
    '<div class="arch-grid">' +
      '<div class="arch-box">' +
        '<h4><span class="arch-tag badge-info">SQLite · 唯一事实源</span>实体属性 + 入口检索</h4>' +
        '<ul>' +
          '<li><code>system</code>：系统目录（名称/类型/负责人/说明）</li>' +
          '<li><code>dataset.system_id</code>：数据集归属</li>' +
          '<li><code>system_edge</code>：显式系统边（接口/置信度/来源）</li>' +
          '<li><code>v_system_edge</code>：显式边 ∪ 数据集边投影</li>' +
          '<li><code>change_log</code>：系统/归属/系统边的版本与回滚</li>' +
        '</ul>' +
      '</div>' +
      '<div class="arch-box">' +
        '<h4><span class="arch-tag badge-brand">Kùzu · 派生层</span>关系实例 + 链路遍历</h4>' +
        '<ul>' +
          '<li><code>System</code> 节点：只存 id/name/type</li>' +
          '<li><code>LINEAGE_SYSTEM</code>：系统级关系实例</li>' +
          '<li><code>Dataset.system_id</code>：归属属性，供下钻过滤</li>' +
          '<li>N 跳：<code>*1..n</code> 变长路径 + <code>min(length(p))</code></li>' +
          '<li>随时可从 SQLite 全量重建，可整体移除</li>' +
        '</ul>' +
      '</div>' +
      '<div class="arch-box">' +
        '<h4><span class="arch-tag badge-ok">同一渲染协议</span>不另起炉灶</h4>' +
        '<ul>' +
          '<li><code>SystemGraphPayload</code> 与 <code>GraphPayload</code> 同构</li>' +
          '<li>同一画布：系统 / 数据集 / 字段三级切换</li>' +
          '<li>同一套过滤、缩放、详情、边列表</li>' +
          '<li>AI 出图与手工浏览共用 <code>applyGraph</code></li>' +
          '<li>无新增服务、消息队列或搜索集群</li>' +
        '</ul>' +
      '</div>' +
    '</div>' +
    '<div class="flowrow"><b>GET /lineage/systems</b><span>→</span><b>图路由</b><span>（clean 走 Kùzu；dirty 自动重建；失败降级 CTE）</span><span>→</span><b>SystemGraphPayload</b><span>→</span><b>同一画布</b></div>' +
    '<div style="display:flex;gap:12px;align-items:stretch">' +
      '<div class="principle" style="background:var(--brand-50);border:1px solid var(--brand-200)">' +
        '<div class="pt"><span class="pn" style="background:var(--brand-700)">1</span>系统边可解释</div>' +
        '每条系统边必须带 <code>origin</code>（explicit/derived/both）与 <code>dataset_edge_count</code>；投影边能列出底层数据集边，显式边允许没有数据集证据，但不允许「无法解释来源的线」。' +
      '</div>' +
      '<div class="principle" style="background:var(--info-soft);border:1px solid #BFDBFE">' +
        '<div class="pt"><span class="pn" style="background:var(--info-deep)">2</span>投影不落库</div>' +
        '数据集边 + <code>dataset.system_id</code> 实时投影为系统边，避免「数据集边改了、系统边忘了改」的双写漂移；只有显式边落 <code>system_edge</code> 并参与版本。' +
      '</div>' +
      '<div class="principle" style="background:var(--warning-soft);border:1px solid #FDE68A">' +
        '<div class="pt"><span class="pn" style="background:var(--warning-deep)">3</span>环要检测，不阻断</div>' +
        '数据集级无环不代表系统级无环：聚合可能产生环。查询用 <code>DISTINCT</code> + <code>min(hop)</code> + 跳数上限；UI 标记「系统级聚合环」，不据此判定数据集级有环。' +
      '</div>' +
    '</div>' +
    '<div class="sec-t" style="margin-top:14px">关键 SQL / Cypher</div>' +
    '<div class="codelist">' + esc(
      '-- SQLite：系统级关系视图（显式 ∪ 投影）\n' +
      'CREATE VIEW v_system_edge AS\n' +
      'WITH derived AS (\n' +
      '  SELECT d_from.system_id AS from_system, d_to.system_id AS to_system,\n' +
      '         COUNT(DISTINCT e.from_dataset || \'->\' || e.to_dataset) AS dataset_edge_count\n' +
      '  FROM edge e JOIN dataset d_from ON d_from.id = e.from_dataset\n' +
      '              JOIN dataset d_to   ON d_to.id   = e.to_dataset\n' +
      '  WHERE d_from.system_id IS NOT NULL AND d_to.system_id IS NOT NULL\n' +
      '    AND d_from.system_id <> d_to.system_id\n' +
      '  GROUP BY 1, 2\n' +
      ')\n' +
      'SELECT ... FROM system_edge e LEFT JOIN derived d ...\n' +
      'UNION ALL SELECT ... FROM derived d LEFT JOIN system_edge e ...;\n\n' +
      '-- Kùzu：系统级 N 跳上游\n' +
      'MATCH p = (s:System {id: $sid})<-[:LINEAGE_SYSTEM*1..3]-(up:System)\n' +
      'RETURN DISTINCT up.id, min(length(p)) AS hop ORDER BY hop;'
    ) + '</div>' +
    '<div class="faint" style="font-size:11px;margin-top:10px;line-height:1.6">本原型只验证交互与信息架构，不代表后端已实现。设计定稿见 <code>docs/01_design/Clew-设计方案.md</code> §4.7 / §5.3 与 <code>docs/01_design/Clew-数据模型.md</code> §3.3 / §十。</div>';
  modal("系统级血缘 · 同一分层架构上的第三层视图", html,
    '<button class="btn" onclick="toggleCycleDemo();closeModal();openArch()">' + (S.demoCycle ? "移除演示环" : "注入系统级环（演示）") + '</button>' +
    '<button class="btn btn-primary" onclick="closeModal()">关闭</button>');
}
function modal(title, body, foot) {
  closeModal();
  const ov = document.createElement("div");
  ov.className = "overlay"; ov.id = "modal-ov";
  ov.innerHTML = '<div class="modal"><div class="modal-head"><h3>' + title + '</h3>' +
    '<button class="btn btn-ghost btn-xs" onclick="closeModal()">✕</button></div>' +
    '<div class="modal-body">' + body + '</div>' +
    '<div class="modal-foot">' + (foot || '<button class="btn" onclick="closeModal()">关闭</button>') + '</div></div>';
  ov.addEventListener("mousedown", e => { if (e.target === ov) closeModal(); });
  document.body.appendChild(ov);
}
function closeModal() { const ov = document.getElementById("modal-ov"); if (ov) ov.remove(); }

/* ============================================================
   启动
   ============================================================ */
render();
</script>
